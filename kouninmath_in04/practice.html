const patternSets = {
  'transpose':{label:'両辺に文字（R6-2・R1-2）', keys:['R6-2','R1-2']},
  'fraction':{label:'分数（R7-1・R4-2・R3-1・R2-2）', keys:['R7-1','R4-2','R3-1','R2-2']},
  'decimal':{label:'小数（R6-1・R4-1・R1-1）', keys:['R6-1','R4-1','R1-1']},
  'property':{label:'性質判別（R5-1・R3-2・R7-2・R5-2）', keys:['R5-1','R3-2','R7-2','R5-2']}
};

let currentMode = 'year';
let currentQuestions = [];
let currentKeys = [];
let answered = [];

function switchMode(mode){
  currentMode = mode;
  document.getElementById('tabYear').classList.toggle('active', mode === 'year');
  document.getElementById('tabPattern').classList.toggle('active', mode === 'pattern');
  rebuildSelect();
}

function rebuildSelect(){
  const sel = document.getElementById('setSel');
  sel.innerHTML = '';
  const sets = currentMode === 'year' ? yearSets : patternSets;
  for(const key in sets){
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = sets[key].label;
    sel.appendChild(opt);
  }
  document.getElementById('setInfo').textContent = currentMode === 'year'
    ? '本番形式で年度ごとに挑戦できます。'
    : '苦手なパターンに絞って集中演習できます。';
}

function loadSet(){
  const setKey = document.getElementById('setSel').value;
  const sets = currentMode === 'year' ? yearSets : patternSets;
  currentKeys = sets[setKey].keys;
  currentQuestions = currentKeys.map(k => pastProblems[k]);
  answered = new Array(currentQuestions.length).fill(null);
  renderQuiz();
}

function renderQuiz(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  currentQuestions.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    card.innerHTML = `
      <div class="qheader">
        <span class="qnum">問${i+1}</span>
        <span class="qyear">${p.year}</span>
        <span class="qtype">${patternNames[p.pattern]}</span>
      </div>
      <div class="qbody">${p.q}</div>
      <div class="choices" id="ch${i}">
        ${p.choices.map((c,j) => `<button class="choice-btn" onclick="selectAns(${i},${j})">${'①②③④'[j]} ${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb${i}"></div>
    `;
    area.appendChild(card);
  });
  document.getElementById('scoreArea').classList.remove('show');
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(area, {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

function selectAns(qIdx, cIdx){
  if(answered[qIdx] !== null) return;
  answered[qIdx] = cIdx;
  const correct = currentQuestions[qIdx].correct;
  const buttons = document.querySelectorAll(`#ch${qIdx} .choice-btn`);
  buttons.forEach((btn, j) => {
    btn.disabled = true;
    if(j === correct) btn.classList.add('correct');
    else if(j === cIdx) btn.classList.add('wrong');
  });
  const fb = document.getElementById(`fb${qIdx}`);
  let stepsHtml = '';
  if(currentQuestions[qIdx].steps){
    stepsHtml = '<div class="steps-table"><table>' +
      currentQuestions[qIdx].steps.map(s =>
        `<tr><td class="label">${s[0]}</td><td>${s[1]}</td></tr>`
      ).join('') + '</table></div>';
  }
  if(cIdx === correct){
    fb.className = 'feedback show ok';
    fb.innerHTML = `⭕ 正解！<br>${currentQuestions[qIdx].expl}${stepsHtml}`;
  }else{
    fb.className = 'feedback show ng';
    fb.innerHTML = `❌ 不正解。正解は ${'①②③④'[correct]}<br>${currentQuestions[qIdx].expl}${stepsHtml}`;
  }
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(fb, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
  if(answered.every(a => a !== null)){
    const score = answered.filter((a,i) => a === currentQuestions[i].correct).length;
    document.getElementById('scoreNum').textContent = `${score} / ${currentQuestions.length} 問正解`;
    let msg = '';
    if(score === currentQuestions.length) msg = '🎉 全問正解！過去問もばっちりです。';
    else if(score >= currentQuestions.length / 2) msg = '👍 もう少し！別のセットでも腕試ししてみましょう。';
    else msg = '💪 IN02・IN03 を見直して、もう一度挑戦しましょう。';
    document.getElementById('scoreMsg').textContent = msg;
    document.getElementById('scoreArea').classList.add('show');
  }
}

window.addEventListener('load', () => {
  rebuildSelect();
  if(window._katexReady){
    loadSet();
  }else{
    window._onKatexReady = loadSet;
  }
});
</script>

</body>
</html>
