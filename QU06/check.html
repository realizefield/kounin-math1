<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QU06 変域あり最大・最小値 ④ 確認テスト</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic',sans-serif;background:#fafaf9;color:#1c1917;font-size:16px;line-height:1.7;}
.header{background:#d97706;color:white;padding:14px 20px;}
.header h1{font-size:1.1rem;font-weight:700;}
.header p{font-size:0.85rem;opacity:0.9;margin-top:2px;}
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.step-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.step-btn{flex:1;min-width:80px;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:0.78rem;cursor:pointer;font-weight:700;}
.step-btn.active{background:#d97706;color:white;}
.step-btn.done{background:#d1fae5;color:#065f46;}
.prob-num{font-size:0.95rem;font-weight:700;color:#d97706;margin:14px 0 6px;}
.prob-num:first-child{margin-top:0;}
.problem-text{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;font-size:0.93rem;margin-bottom:8px;}
canvas{display:block;margin:6px auto;}
.choices{display:flex;flex-direction:column;gap:7px;margin:8px 0;}
.choice-inp{padding:11px 14px;border:2px solid #e7e5e4;border-radius:8px;font-family:inherit;font-size:0.9rem;cursor:pointer;background:white;text-align:left;}
.choice-inp:hover{border-color:#d97706;background:#fffbeb;}
.divider{border:none;border-top:1px solid #f5f5f4;margin:16px 0;}
.submit-btn{width:100%;padding:14px;background:#d97706;color:white;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;margin-top:12px;}
.submit-btn:hover{background:#b45309;}
.result-card{background:white;border-radius:12px;padding:24px;box-shadow:0 1px 4px rgba(0,0,0,0.08);display:none;}
.score-big{font-size:3rem;font-weight:700;color:#d97706;text-align:center;}
.score-label{text-align:center;color:#78716c;font-size:0.9rem;}
.review-item{border-left:4px solid #e7e5e4;padding:10px 14px;margin:8px 0;border-radius:0 8px 8px 0;font-size:0.88rem;}
.review-item.ok{border-color:#10b981;background:#f0fdf4;}
.review-item.ng{border-color:#ef4444;background:#fef2f2;}
.nav-btn{display:block;width:100%;padding:14px;background:#059669;color:white;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;margin-top:10px;}
.back-link{display:block;text-align:center;color:#a8a29e;font-size:0.85rem;margin-top:14px;text-decoration:none;}
.back-link:hover{color:#d97706;}
#confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:9999;}
</style>
</head>
<body>
<div id="confetti-container"></div>
<div class="header">
  <h1>QU06 ④ 確認テスト ― 変域あり最大・最小値</h1>
  <p>第4章 二次関数 ／ 5問</p>
</div>
<div class="container">
  <div class="step-nav">
    <button class="step-btn done" onclick="location.href='intro.html'">①導入</button>
    <button class="step-btn done" onclick="location.href='example.html'">②例題</button>
    <button class="step-btn done" onclick="location.href='drill.html'">③練習</button>
    <button class="step-btn active">④確認</button>
  </div>

  <div class="card" id="testCard">

    <div class="prob-num">問1</div>
    <div class="problem-text" id="q1t"></div>
    <canvas id="cv1" width="300" height="170"></canvas>
    <div class="choices" id="c1">
      <button class="choice-inp" onclick="setAns(0,0,this)">① 最大値 6、最小値 −3</button>
      <button class="choice-inp" onclick="setAns(0,1,this)">② 最大値 1、最小値 −3</button>
      <button class="choice-inp" onclick="setAns(0,2,this)">③ 最大値 −3、最小値 6</button>
      <button class="choice-inp" onclick="setAns(0,3,this)">④ 最大値 6、最小値 1</button>
    </div>
    <hr class="divider">

    <div class="prob-num">問2</div>
    <div class="problem-text" id="q2t"></div>
    <canvas id="cv2" width="300" height="170"></canvas>
    <div class="choices" id="c2">
      <button class="choice-inp" onclick="setAns(1,0,this)">① 最大値 27、最小値 2</button>
      <button class="choice-inp" onclick="setAns(1,1,this)">② 最大値 6、最小値 27</button>
      <button class="choice-inp" onclick="setAns(1,2,this)">③ 最大値 27、最小値 6</button>
      <button class="choice-inp" onclick="setAns(1,3,this)">④ 最大値 6、最小値 2</button>
    </div>
    <hr class="divider">

    <div class="prob-num">問3</div>
    <div class="problem-text" id="q3t"></div>
    <canvas id="cv3" width="300" height="170"></canvas>
    <div class="choices" id="c3">
      <button class="choice-inp" onclick="setAns(2,0,this)">① 最大値 11、最小値 3</button>
      <button class="choice-inp" onclick="setAns(2,1,this)">② 最大値 3、最小値 11</button>
      <button class="choice-inp" onclick="setAns(2,2,this)">③ 最大値 11、最小値 2</button>
      <button class="choice-inp" onclick="setAns(2,3,this)">④ 最大値 2、最小値 11</button>
    </div>
    <hr class="divider">

    <div class="prob-num">問4（R7-1 類似）</div>
    <div class="problem-text" id="q4t"></div>
    <canvas id="cv4" width="300" height="170"></canvas>
    <div class="choices" id="c4">
      <button class="choice-inp" onclick="setAns(3,0,this)">① 最大値 4、最小値 10</button>
      <button class="choice-inp" onclick="setAns(3,1,this)">② 最大値 10、最小値 2</button>
      <button class="choice-inp" onclick="setAns(3,2,this)">③ 最大値 10、最小値 4</button>
      <button class="choice-inp" onclick="setAns(3,3,this)">④ 最大値 2、最小値 10</button>
    </div>
    <hr class="divider">

    <div class="prob-num">問5（R6-1 類似）</div>
    <div class="problem-text" id="q5t"></div>
    <canvas id="cv5" width="300" height="170"></canvas>
    <div class="choices" id="c5">
      <button class="choice-inp" onclick="setAns(4,0,this)">① 最大値 3、最小値 2</button>
      <button class="choice-inp" onclick="setAns(4,1,this)">② 最大値 11、最小値 3</button>
      <button class="choice-inp" onclick="setAns(4,2,this)">③ 最大値 2、最小値 11</button>
      <button class="choice-inp" onclick="setAns(4,3,this)">④ 最大値 11、最小値 2</button>
    </div>

    <button class="submit-btn" onclick="submit()">採点する</button>
  </div>

  <div class="result-card" id="resultCard">
    <div class="score-big" id="scoreBig"></div>
    <div class="score-label">/ 5問正解</div>
    <div id="reviewArea" style="margin-top:20px;"></div>
    <button class="nav-btn" onclick="location.href='../gamba_kounin.html'">✅ メニューに戻る</button>
    <button class="nav-btn" style="background:#d97706;margin-top:8px;" onclick="location.reload()">もう一度テストを受ける</button>
  </div>
  <a href="../gamba_kounin.html" class="back-link">← メニューに戻る</a>
</div>

<script>
function k(e){return katex.renderToString(e,{throwOnError:false});}

const qs=[
  {fn:x=>(x-2)*(x-2)-3, vertex:[2,-3], domain:[-1,4], ans:0,
   fnStr:'y=(x-2)^2-3', domStr:'-1 \\leqq x \\leqq 4',
   sol:'頂点(2,−3)が変域内。最小値＝−3。x=−1→y=6、x=4→y=1。遠いのはx=−1。最大値＝6。'},
  {fn:x=>(x+1)*(x+1)+2, vertex:[-1,2], domain:[1,4], ans:2,
   fnStr:'y=(x+1)^2+2', domStr:'1 \\leqq x \\leqq 4',
   sol:'頂点(−1,2)が変域の外（左）。x=1→y=6、x=4→y=27。最大値＝27、最小値＝6。'},
  {fn:x=>(x-1)*(x-1)+2, vertex:[1,2], domain:[-2,2], ans:0,
   fnStr:'y=(x-1)^2+2', domStr:'-2 \\leqq x \\leqq 2',
   sol:'頂点(1,2)が変域内。最小値＝2（x=1）。x=−2→y=11、x=2→y=3。遠いのはx=−2。最大値＝11。'},
  {fn:x=>2*(x-2)*(x-2)+2, vertex:[2,2], domain:[0,1], ans:2,
   fnStr:'y=2(x-2)^2+2', domStr:'0 \\leqq x \\leqq 1',
   sol:'頂点(2,2)が変域の外（右）。x=0→y=10、x=1→y=4。最大値＝10、最小値＝4。'},
  {fn:x=>(x-1)*(x-1)+2, vertex:[1,2], domain:[-2,2], ans:3,
   fnStr:'y=(x-1)^2+2', domStr:'-2 \\leqq x \\leqq 2',
   sol:'頂点(1,2)が変域内。最小値＝2。x=−2→y=11、x=2→y=3。最大値＝11。'},
];

// 問題文
qs.forEach((q,i)=>{
  document.getElementById('q'+(i+1)+'t').innerHTML=
    '2次関数 '+k(q.fnStr)+' について、変域を '+k(q.domStr)+' とするとき、最大値と最小値を求めよ。';
});

// グラフ
function drawG(id,q){
  const cv=document.getElementById(id);
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const d0=q.domain[0],d1=q.domain[1];
  const allY=[];
  for(let x=d0;x<=d1+0.001;x+=0.05) allY.push(q.fn(x));
  const ylo=Math.min(...allY),yhi=Math.max(...allY);
  const mL=30,mR=30,mT=12,mB=30;
  const drawH=H-mT-mB, drawW=W-mL-mR;
  function px(x){return mL+(x-d0)/(d1-d0)*drawW;}
  function py(y){return mT+(yhi-y)/(yhi-ylo||1)*drawH;}
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#d97706';ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=d0;x<=d1+0.001;x+=0.04){
    const y=q.fn(x);
    x===d0?ctx.moveTo(px(x),py(y)):ctx.lineTo(px(x),py(y));
  }
  ctx.stroke();
  [d0,d1].forEach(x=>{
    ctx.fillStyle='#d97706';ctx.beginPath();ctx.arc(px(x),py(q.fn(x)),5,0,Math.PI*2);ctx.fill();
  });
  const [vx,vy]=q.vertex;
  if(vx>=d0&&vx<=d1){
    ctx.fillStyle='#b45309';ctx.beginPath();ctx.arc(px(vx),py(vy),6,0,Math.PI*2);ctx.fill();
  }
  ctx.fillStyle='#57534e';ctx.font='11px BIZ UDPGothic';
  ctx.fillText(d0,px(d0)-4,H-4);ctx.fillText(d1,px(d1)-4,H-4);
  if(vx>d0&&vx<d1&&Math.abs(px(vx)-px(d0))>16&&Math.abs(px(vx)-px(d1))>16)
    ctx.fillText(vx,px(vx)-4,H-4);
}
qs.forEach((q,i)=>drawG('cv'+(i+1),q));

// 問3と問5は同じ関数なのでchoicesを調整済み
// 問3の正解は ansIdx=0（最大値11、最小値2）
// 問5の正解は ansIdx=3（最大値11、最小値2）→同じ答えだが選択肢の順を変えてある

const chosen=[null,null,null,null,null];
function setAns(qi,val,btn){
  chosen[qi]=val;
  btn.closest('div').querySelectorAll('.choice-inp').forEach(b=>{
    b.style.borderColor=b===btn?'#d97706':'';
    b.style.background=b===btn?'#fffbeb':'white';
  });
}

const answerTexts=[
  ['最大値6・最小値−3','最大値1・最小値−3','最大値−3・最小値6','最大値6・最小値1'],
  ['最大値27・最小値2','最大値6・最小値27','最大値27・最小値6','最大値6・最小値2'],
  ['最大値11・最小値3','最大値3・最小値11','最大値11・最小値2','最大値2・最小値11'],
  ['最大値4・最小値10','最大値10・最小値2','最大値10・最小値4','最大値2・最小値10'],
  ['最大値3・最小値2','最大値11・最小値3','最大値2・最小値11','最大値11・最小値2'],
];

function submit(){
  let score=0;
  const revs=qs.map((q,i)=>{const ok=(chosen[i]===q.ans);if(ok)score++;return{ok,q,i};});
  document.getElementById('testCard').style.display='none';
  document.getElementById('resultCard').style.display='block';
  document.getElementById('scoreBig').textContent=score;
  document.getElementById('reviewArea').innerHTML='<h3 style="font-size:0.95rem;margin-bottom:10px;">解答・解説</h3>'+
  revs.map((r,i)=>`<div class="review-item ${r.ok?'ok':'ng'}">
    <strong>問${i+1}</strong> ${r.ok?'✅ 正解':'❌ 不正解'}　正解：${answerTexts[i][r.q.ans]}<br>
    ${r.q.sol}
  </div>`).join('');
  if(score===5){markPassed();launchConfetti();}
}

function markPassed(){try{localStorage.setItem('QU06_passed','1');}catch(e){}}
function launchConfetti(){
  const c=document.getElementById('confetti-container');
  const cols=['#d97706','#fbbf24','#10b981','#3b82f6','#8b5cf6'];
  for(let i=0;i<80;i++){
    const el=document.createElement('div');const sz=Math.random()*10+6;
    el.style.cssText=`position:absolute;width:${sz}px;height:${sz}px;background:${cols[Math.floor(Math.random()*cols.length)]};left:${Math.random()*100}%;top:-20px;border-radius:${Math.random()>.5?'50%':'2px'};animation:fall ${Math.random()*2+1.5}s linear ${Math.random()}s forwards;`;
    c.appendChild(el);
  }
  const s=document.createElement('style');s.textContent='@keyframes fall{to{transform:translateY(100vh) rotate(720deg);opacity:0;}}';
  document.head.appendChild(s);setTimeout(()=>c.innerHTML='',4000);
}
</script>
</body>
</html>
