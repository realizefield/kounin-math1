<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QU05 過去問演習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"

<style>
:root{
  --primary:#d97706;--primary-d:#b45309;--primary-l:#fffbeb;
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --green:#059669;--green-l:#f0fdf4;--red:#dc2626;--red-l:#fef2f2;
  --blue:#0284c7;--blue-l:#f0f9ff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;padding-bottom:60px}
/* ヘッダー */
.page-header{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:16px 16px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.page-header h1{font-size:17px;font-weight:700}
.page-header p{font-size:12px;opacity:.85;margin-top:2px}
/* ナビ */
.nav-bar{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:60px;z-index:99}
.nav-bar::-webkit-scrollbar{height:4px}.nav-bar::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.nav-btn{flex-shrink:0;padding:6px 14px;border:2px solid var(--border);border-radius:20px;background:#fff;font-size:13px;cursor:pointer;font-family:inherit;transition:.2s}
.nav-btn.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:700}
/* セクション */
.year-section{display:none;padding:16px}
.year-section.active{display:block}
.year-title{font-size:16px;font-weight:700;color:var(--primary);margin-bottom:12px;padding-bottom:6px;border-bottom:2px solid var(--primary-l)}
/* 問題カード */
.q-card{background:var(--card);border:1px solid var(--border);border-radius:12px;margin-bottom:16px;overflow:hidden}
.q-head{background:var(--primary-l);padding:10px 14px;display:flex;align-items:center;gap:10px}
.q-num{background:var(--primary);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.q-type{font-size:13px;color:var(--primary-d);font-weight:700}
.q-body{padding:14px}
.q-text{font-size:14px;line-height:1.8;margin-bottom:12px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{padding:10px 14px;border:2px solid var(--border);border-radius:8px;background:#fff;font-size:14px;text-align:left;cursor:pointer;font-family:inherit;transition:.2s;line-height:1.6}
.choice-btn:hover{border-color:var(--primary);background:var(--primary-l)}
.choice-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green);font-weight:700}
.choice-btn.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
.choice-btn.show-correct{border-color:var(--green);background:var(--green-l)}
.choice-btn:disabled{cursor:default}
/* 解説 */
.explanation{margin-top:12px;padding:12px;background:#f8fafc;border-radius:8px;border-left:4px solid var(--primary);font-size:13px;line-height:1.8;display:none}
.explanation.show{display:block}
.explanation .ex-title{font-weight:700;color:var(--primary);margin-bottom:6px}
/* 結果バッジ */
.result-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;margin-top:8px}
.badge-ok{background:var(--green-l);color:var(--green)}
.badge-ng{background:var(--red-l);color:var(--red)}
/* 進捗 */
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin:0 16px 4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:3px;transition:.4s}
.progress-text{font-size:12px;color:var(--muted);text-align:right;padding:0 16px 12px}
/* チェックボタン */
.check-link{display:block;margin:20px 16px 0;padding:14px;background:var(--primary);color:#fff;border-radius:12px;text-align:center;font-size:15px;font-weight:700;text-decoration:none}
</style>
</head>
<body>

<div class="page-header">
  <h1>📊 QU05 二次関数 過去問演習</h1>
  <p>R4〜R7 全8回・年度別に取り組もう</p>
</div>

<nav class="nav-bar" id="navBar"></nav>
<div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>

<div id="sections"></div>

<script>
// ─────────────────────────────────────────
// 過去問データ R4〜R7 全8回
// ─────────────────────────────────────────
const YEARS = [
  {
    id:'r7_2', label:'R7-2',
    qs:[
      {
        num:1, type:'最大値・最小値',
        text:'二次関数 $y=-2(x-1)^2+4$ について、正しいものを選べ。',
        choices:[
          '頂点は $(1, 4)$ で、グラフは上に開く',
          '頂点は $(1, 4)$ で、グラフは下に開く',
          '頂点は $(-1, 4)$ で、グラフは下に開く',
          '頂点は $(1, -4)$ で、グラフは上に開く'
        ],
        ans:1,
        exp:'$y=a(x-p)^2+q$ の形より、頂点は $(p,q)=(1,4)$。$a=-2\lt 0$ なのでグラフは下に開く（上に凸）。最大値は $x=1$ のとき $y=4$。'
      },
      {
        num:2, type:'x軸との共有点',
        text:'二次関数 $y=2x^2-11x+5$ の $x$ 軸との共有点の $x$ 座標を求めよ。',
        choices:[
          '$x=\\dfrac{1}{2}$ と $x=5$',
          '$x=-\\dfrac{1}{2}$ と $x=5$',
          '$x=\\dfrac{1}{2}$ と $x=-5$',
          '$x=1$ と $x=5$'
        ],
        ans:0,
        exp:'$2x^2-11x+5=0$ を因数分解する。$2x^2-11x+5=(2x-1)(x-5)=0$ より $x=\\dfrac{1}{2},\\ 5$。'
      },
      {
        num:3, type:'二次不等式',
        text:'不等式 $(2x+1)(x-3)\gt 0$ の解を選べ。',
        choices:[
          '$-\\dfrac{1}{2}\lt x\lt 3$',
          '$x\lt -\\dfrac{1}{2}$ または $x\gt 3$',
          '$x\lt -3$ または $x\gt \\dfrac{1}{2}$',
          '$-3\lt x\lt \\dfrac{1}{2}$'
        ],
        ans:1,
        exp:'$(2x+1)(x-3)\gt 0$ は $2x+1=0 \\Rightarrow x=-\\dfrac{1}{2}$、$x-3=0 \\Rightarrow x=3$ が境界。$x\lt -\\dfrac{1}{2}$ または $x\gt 3$ のとき積は正。'
      }
    ]
  },
  {
    id:'r7_1', label:'R7-1',
    qs:[
      {
        num:1, type:'二次関数の識別',
        text:'次のうち、$y$ が $x$ の二次関数であるものを選べ。',
        choices:[
          '$y=3x+2$',
          '$y=-2(x+1)^2$',
          '$y=\\dfrac{1}{x^2}$',
          '$y=\\sqrt{x}$'
        ],
        ans:1,
        exp:'$y=-2(x+1)^2=-2x^2-4x-2$ は $x^2$ の項があり、二次関数。$y=3x+2$ は一次関数、$y=\\dfrac{1}{x^2}$ は分数関数、$y=\\sqrt{x}$ は無理関数。'
      },
      {
        num:2, type:'グラフの概形',
        text:'$y=-2(x+1)^2$ のグラフの概形として正しいものはどれか。',
        choices:[
          '頂点 $(1,0)$、上に開く放物線',
          '頂点 $(-1,0)$、下に開く放物線',
          '頂点 $(1,0)$、下に開く放物線',
          '頂点 $(-1,0)$、上に開く放物線'
        ],
        ans:1,
        exp:'$y=a(x-p)^2+q$ の形より、$p=-1,\\ q=0$ なので頂点は $(-1,0)$。$a=-2\lt 0$ なのでグラフは下に開く。'
      },
      {
        num:3, type:'平方完成・頂点',
        text:'$y=x^2-2x+3$ を変形して頂点の座標を求めよ。',
        choices:[
          '頂点 $(2, 3)$',
          '頂点 $(-1, 2)$',
          '頂点 $(1, 2)$',
          '頂点 $(1, -2)$'

  },
  {
    id:'r6_2', label:'R6-2',
    qs:[
      {
        num:1, type:'二次関数の識別',
        text:'次のうち、二次関数のグラフが「上に開く」ものはどれか。',
        choices:[
          '$y=-x^2+2$',
          '$y=-(x-1)^2$',
          '$y=2(x+3)^2-1$',
          '$y=-3x^2+x$'
        ],
        ans:2,
        exp:'$a\gt 0$ なら上に開く（下が細い）。$y=2(x+3)^2-1$ は $a=2\gt 0$ なので上に開く。他はすべて $a\lt 0$ で下に開く。'

      {
        num:2, type:'グラフの概形',
        text:'$y=-x^2+2$ のグラフの頂点はどれか。',
        choices:[
          '$(2, 0)$',
          '$(0, 2)$',
          '$(-2, 0)$',
          '$(0, -2)$'
        ],

        exp:'$y=-x^2+2=-(x-0)^2+2$ の形なので頂点は $(0, 2)$。$a=-1\lt 0$ で下に開く。'

      {
        num:3, type:'x切片から頂点',
        text:'$y=(x-1)(x-3)$ のグラフの頂点を求めよ。',
        choices:[
          '$(1, 0)$',
          '$(3, 0)$',
          '$(2, -1)$',
          '$(2, 1)$'
        ],
        ans:2,
        exp:'$x$ 切片は $x=1$ と $x=3$。軸は中点 $x=\\dfrac{1+3}{2}=2$。$y=(2-1)(2-3)=1 \\times (-1)=-1$。頂点は $(2,-1)$。'
      }
    ]
  },
  {
    id:'r6_1', label:'R6-1',
    qs:[
      {
        num:1, type:'文章題',
        text:'縦の長さが $x$、横の長さが $(10-x)$ の長方形の面積 $S$ を式で表すと？',
        choices:[
          '$S=x(10+x)$',
          '$S=x(10-x)$',
          '$S=10x-x$',
          '$S=(10-x)^2$'
        ],
        ans:1,
        exp:'面積 $=$ 縦 $\\times$ 横 $= x(10-x) = 10x - x^2$。これは $x$ についての二次関数。'
      },
      {
        num:2, type:'平行移動',
        text:'$y=-2(x-3)^2-5$ の頂点の座標はどれか。',
        choices:[
          '$(-3, -5)$',
          '$(3, 5)$',
          '$(3, -5)$',
          '$(-3, 5)$'
        ],
        ans:2,
        exp:'$y=a(x-p)^2+q$ の形より $p=3,\\ q=-5$。頂点は $(3,-5)$。$a=-2\lt 0$ で下に開く。'
      },
      {
        num:3, type:'平方完成',
        text:'$y=x^2-4x+1$ を平方完成すると？',
        choices:[
          '$y=(x-2)^2-3$',
          '$y=(x-2)^2+3$',
          '$y=(x+2)^2-3$',
          '$y=(x-4)^2-1$'
        ],
        ans:0,
        exp:'$y=x^2-4x+1=(x^2-4x+4)-4+1=(x-2)^2-3$。頂点は $(2,-3)$。'
      }
    ]
  },
  {
    id:'r5_2', label:'R5-2',
    qs:[
      {
        num:1, type:'グラフの概形',
        text:'$y=-(x+3)^2-2$ のグラフとして正しいものはどれか。',
        choices:[
          '頂点 $(3,-2)$、下に開く',
          '頂点 $(-3,2)$、上に開く',
          '頂点 $(-3,-2)$、下に開く',
          '頂点 $(3,2)$、上に開く'
        ],
        ans:2,
        exp:'$y=a(x-p)^2+q$ の形より $p=-3,\\ q=-2$。頂点は $(-3,-2)$。$a=-1\lt 0$ で下に開く。'
      },
      {
        num:2, type:'頂点から式を決める',
        text:'頂点が $(1,-2)$ で、点 $(0,1)$ を通る二次関数 $y=m(x-p)^2+q$ を求めよ。',
        choices:[
          '$y=3(x-1)^2-2$',
          '$y=-3(x-1)^2+2$',
          '$y=3(x+1)^2-2$',
          '$y=-3(x+1)^2-2$'
        ],
        ans:0,
        exp:'頂点 $(1,-2)$ より $y=m(x-1)^2-2$。点 $(0,1)$ を代入：$1=m(0-1)^2-2=m-2$ より $m=3$。$y=3(x-1)^2-2$。'
      },
      {
        num:3, type:'平方完成・頂点',
        text:'$y=x^2-6x+12$ を平方完成して頂点を求めよ。',
        choices:[
          '頂点 $(3, 3)$',
          '頂点 $(-3, 3)$',
          '頂点 $(3, -3)$',

        ans:0,

    ]
  },
  {
    id:'r5_1', label:'R5-1',
    qs:[
      {
        num:1, type:'グラフの概形',
        text:'$a\gt 0,\\ p\gt 0$ のとき、$y=a(x-p)^2$ のグラフの特徴はどれか。',
        choices:[
          '頂点は原点にある',
          '頂点は $x$ 軸上の正の部分にあり、上に開く',
          '頂点は $y$ 軸上にある',
          '頂点は第3象限にある'
        ],
        ans:1,
        exp:'$y=a(x-p)^2+0$ より頂点は $(p, 0)$。$p\gt 0$ なので $x$ 軸の正の部分。$a\gt 0$ なのでグラフは上に開く。'
      },
      {
        num:2, type:'代入してkの値',
        text:'$y=x^2+4kx-k$ が点 $(0, 3)$ を通るとき、$k$ の値を求めよ。',
        choices:[
          '$k=3$',
          '$k=-3$',
          '$k=1$',
          '$k=-1$'
        ],
        ans:1,
        exp:'$x=0,\\ y=3$ を代入：$3=0^2+4k \\cdot 0-k=-k$ より $k=-3$。'
      },
      {
        num:3, type:'x切片から頂点',
        text:'$y=-x^2+6x-8$ の $x$ 切片が $x=2,\\ 4$ のとき、頂点を求めよ。',
        choices:[
          '$(2, 0)$',
          '$(3, 1)$',
          '$(4, 0)$',
          '$(3, -1)$'
        ],
        ans:1,
        exp:'$x$ 切片 $2$ と $4$ の中点が軸：$x=\\dfrac{2+4}{2}=3$。$y=-(3)^2+6 \\cdot 3-8=-9+18-8=1$。頂点は $(3,1)$。'
      }
    ]
  },
  {
    id:'r4_2', label:'R4-2',
    qs:[
      {
        num:1, type:'平行移動',
        text:'$y=2x^2$ を $x$ 軸方向に $3$、$y$ 軸方向に $4$ だけ平行移動した式はどれか。',
        choices:[
          '$y=2(x+3)^2+4$',
          '$y=2(x-3)^2+4$',
          '$y=2(x-3)^2-4$',
          '$y=2x^2+4$'
        ],
        ans:1,
        exp:'$x$ 軸方向に $p$、$y$ 軸方向に $q$ 平行移動 $\\Rightarrow$ $y=2(x-3)^2+4$。$x$ を $x-3$ に置き換え、$+4$ を加える。'
      },
      {
        num:2, type:'代入してaの値',
        text:'$y=a(x+1)^2-2$ が点 $(1, 6)$ を通るとき、$a$ の値を求めよ。',
        choices:[
          '$a=1$',
          '$a=2$',
          '$a=3$',
          '$a=4$'
        ],
        ans:1,
        exp:'$x=1,\\ y=6$ を代入：$6=a(1+1)^2-2=4a-2$ より $4a=8$、$a=2$。'
      },
      {
        num:3, type:'x切片から頂点',
        text:'$y=-x^2-4x$ の $x$ 切片が $x=-4,\\ 0$ のとき、頂点を求めよ。',
        choices:[
          '$(-2, 4)$',
          '$(2, -4)$',

          '$(-2, -4)$'
        ],
        ans:0,

        num:1, type:'平行移動',
        text:'$y=-2x^2$ を $x$ 軸方向に $-3$ だけ平行移動した式はどれか。',
        choices:[
          '$y=-2(x-3)^2$',
          '$y=-2(x+3)^2$',
          '$y=-2x^2-3$',

        ans:1,
        exp:'$x$ 軸方向に $-3$ 平行移動 $\\Rightarrow$ $x$ を $x-(-3)=x+3$ に置き換え。$y=-2(x+3)^2$。'

        num:3, type:'平方完成',

        choices:[
          '頂点 $(4, 5)$',
          '頂点 $(-2, 1)$',
          '頂点 $(2, 1)$',
          '頂点 $(2, -1)$'
        ],
        ans:2,

      }

// ─────────────────────────────────────────
// 状態管理
// ─────────────────────────────────────────
const state = {}; // state[yearId][qIdx] = {answered, correct}
YEARS.forEach(y => {
  state[y.id] = {};
  y.qs.forEach((q, i) => { state[y.id][i] = {answered:false, correct:false}; });
});

let currentYear = YEARS[0].id;

// ─────────────────────────────────────────
// レンダリング
// ─────────────────────────────────────────
// $...$ をkatex.renderToStringで直接HTMLに変換
function tex(str) {
  if (!window.katex) return str;
  return str.replace(/\$\$(.+?)\$\$/gs, (_, m) => {
    try { return katex.renderToString(m, {throwOnError:false, displayMode:true}); } catch(e){ return _; }
  }).replace(/\$(.+?)\$/gs, (_, m) => {
    try { return katex.renderToString(m, {throwOnError:false, displayMode:false}); } catch(e){ return _; }
  });
}

function renderAll() {
  if (!window._katexReady) { window._katexPending = true; return; }
  document.querySelectorAll('.math-render').forEach(el => {
    el.innerHTML = tex(el.innerHTML);
    el.classList.remove('math-render');
  });
}

function buildUI() {
  const nav = document.getElementById('navBar');
  const sec = document.getElementById('sections');
  nav.innerHTML = '';
  sec.innerHTML = '';

  YEARS.forEach((year, yi) => {
    // ナビボタン
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (year.id === currentYear ? ' active' : '');
    btn.textContent = year.label;
    btn.onclick = () => switchYear(year.id);
    nav.appendChild(btn);

    // セクション
    const div = document.createElement('div');
    div.className = 'year-section' + (year.id === currentYear ? ' active' : '');
    div.id = 'sec_' + year.id;

    let html = `<div class="year-title">📅 ${year.label}</div>`;
    year.qs.forEach((q, qi) =\gt  {
      const s = state[year.id][qi];
      html += `
      \lt div class="q-card" id="card_${year.id}_${qi}"\gt 
        <div class="q-head"><div class="q-num">${q.num}</div>
          <div class="q-type">${q.type}</div>
        </div>
        <div class="q-body"><div class="q-text math-render">${q.text}</div>
          <div class="choices" id="choices_${year.id}_${qi}">
            ${q.choices.map((c, ci) =\gt  `
              \lt button class="choice-btn math-render" onclick="answer('${year.id}',${qi},${ci})">${c}</button>`).join('')}
          </div>
          \lt div class="explanation math-render" id="exp_${year.id}_${qi}"\gt 
            <div class="ex-title">📝 解説</div>
            ${q.exp}
          </div>
        </div>
      </div>`;
    });
    div.innerHTML = html;
    sec.appendChild(div);
  });

  updateProgress();
  renderAll();
}

function switchYear(yearId) {
  currentYear = yearId;
  document.querySelectorAll('.year-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('sec_' + yearId).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b => {
    if (b.textContent === YEARS.find(y => y.id === yearId).label) b.classList.add('active');
  });
}

function answer(yearId, qi, choiceIdx) {
  const s = state[yearId][qi];
  if (s.answered) return;
  s.answered = true;

  const year = YEARS.find(y => y.id === yearId);
  const q = year.qs[qi];
  s.correct = (choiceIdx === q.ans);

  const btns = document.querySelectorAll(`#choices_${yearId}_${qi} .choice-btn`);
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.ans) b.classList.add(s.correct ? 'correct' : 'show-correct');
    if (i === choiceIdx && !s.correct) b.classList.add('wrong');
  });

  document.getElementById(`exp_${yearId}_${qi}`).classList.add('show');
  updateProgress();
}

function updateProgress() {
  let answered = 0, total = 0;
  YEARS.forEach(y => {
    y.qs.forEach((q, i) => {
      total++;
      if (state[y.id][i].answered) answered++;
    });
  });
  const pct = total ? Math.round(answered / total * 100) : 0;
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progText').textContent = `${answered} / ${total} 問回答済み`;
}

buildUI();
</script>
<script src="https://realizefield.github.io/gamba-kounin-seito/gamba-ai.js" defer></script>
