<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QU05 確認テスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"
  onload="window._katexReady=true;if(window._katexPending)doRender()"></script>
<style>
:root{
  --primary:#d97706;--primary-d:#b45309;--primary-l:#fffbeb;
  --bg:#f8fafc;--card:#fff;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;
  --green:#059669;--green-l:#f0fdf4;--red:#dc2626;--red-l:#fef2f2;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'BIZ UDPGothic',sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.7;padding-bottom:60px}
.page-header{background:linear-gradient(135deg,var(--primary),var(--primary-d));color:#fff;padding:16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.page-header h1{font-size:17px;font-weight:700}
.page-header p{font-size:12px;opacity:.85;margin-top:2px}
.progress-wrap{padding:12px 16px 4px;background:#fff;border-bottom:1px solid var(--border)}
.progress-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress-fill{height:100%;background:var(--primary);border-radius:4px;transition:.4s}
.progress-label{font-size:12px;color:var(--muted);text-align:right;margin-top:4px}
/* 問題 */
.q-wrap{padding:16px;display:none}
.q-wrap.active{display:block}
.q-header{font-size:12px;color:var(--primary-d);font-weight:700;margin-bottom:8px}
.q-text{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;font-size:14px;line-height:1.9;margin-bottom:14px}
.source{font-size:11px;color:var(--muted);margin-top:6px}
.choices{display:flex;flex-direction:column;gap:10px}
.choice-btn{padding:12px 14px;border:2px solid var(--border);border-radius:10px;background:#fff;font-size:14px;text-align:left;cursor:pointer;font-family:inherit;transition:.2s;line-height:1.6}
.choice-btn:hover{border-color:var(--primary);background:var(--primary-l)}
.choice-btn.correct{border-color:var(--green);background:var(--green-l);color:var(--green);font-weight:700}
.choice-btn.wrong{border-color:var(--red);background:var(--red-l);color:var(--red)}
.choice-btn.show-correct{border-color:var(--green);background:var(--green-l)}
.choice-btn:disabled{cursor:default}
.explanation{margin-top:14px;padding:14px;background:#f8fafc;border-radius:10px;border-left:4px solid var(--primary);font-size:13px;line-height:1.9;display:none}
.explanation.show{display:block}
.explanation .ex-title{font-weight:700;color:var(--primary-d);margin-bottom:6px}
.next-btn{display:block;width:100%;margin-top:16px;padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;display:none}
.next-btn.show{display:block}
/* 結果画面 */
.result-screen{display:none;padding:24px 16px;text-align:center}
.result-screen.active{display:block}
.result-circle{width:120px;height:120px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 20px;border:4px solid var(--primary);background:var(--primary-l)}
.result-score{font-size:36px;font-weight:700;color:var(--primary)}
.result-total{font-size:14px;color:var(--muted)}
.result-msg{font-size:18px;font-weight:700;margin-bottom:8px}
.result-sub{font-size:14px;color:var(--muted);margin-bottom:24px}
.btn-row{display:flex;flex-direction:column;gap:10px}
.btn-retry{padding:14px;background:var(--primary);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-back{padding:14px;background:var(--card);color:var(--primary);border:2px solid var(--primary);border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:none;display:block;text-align:center}
/* 花吹雪 */
.confetti-piece{position:fixed;width:10px;height:10px;top:-10px;opacity:.9;pointer-events:none;z-index:999;border-radius:2px}
</style>
</head>
<body>

<div class="page-header">
  <h1>✅ QU05 確認テスト</h1>
  <p>二次関数 過去問から5問</p>
</div>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
  <div class="progress-label" id="progLabel">0 / 5 問</div>
</div>

<div id="quizArea"></div>
<div class="result-screen" id="resultScreen"></div>

<script src="../gamba_support.js"></script>
<script>
// ─────────────────────────────────────────
// 確認テスト 5問（厳選）
// ─────────────────────────────────────────
const QUIZ = [
  {
    q: '$y=x^2-4x+1$ を平方完成したとき、頂点の座標はどれか。\n（R6-1 類題）',
    src: 'R6-1',
    choices: [
      '$(4, 1)$',
      '$(2, -3)$',
      '$(-2, -3)$',
      '$(2, 3)$'
    ],
    ans: 1,
    exp: '$y=x^2-4x+1=(x^2-4x+4)-4+1=(x-2)^2-3$。頂点は $(2,-3)$。平方完成の手順：係数2を2乗して引く。'
  },
  {
    q: '$y=-(x+3)^2-2$ のグラフの特徴として正しいものはどれか。\n（R5-2 類題）',
    src: 'R5-2',
    choices: [
      '頂点 $(3,-2)$、上に開く',
      '頂点 $(-3,-2)$、下に開く',
      '頂点 $(-3,2)$、上に開く',
      '頂点 $(3,2)$、下に開く'
    ],
    ans: 1,
    exp: '$y=a(x-p)^2+q$ の形と比べると $p=-3,\\ q=-2$。頂点は $(-3,-2)$。$a=-1\lt 0$ なので下に開く（上に凸）。'
  },
  {
    q: '$y=-x^2+6x-8$ の $x$ 切片が $x=2,\\ 4$ であるとき、頂点の座標を求めよ。\n（R5-1 類題）',
    src: 'R5-1',
    choices: [
      '$(2, 0)$',
      '$(4, 0)$',
      '$(3, 1)$',
      '$(3, -1)$'
    ],
    ans: 2,
    exp: '$x$ 切片 $2$ と $4$ の中点 $\\Rightarrow$ 軸 $x=\\dfrac{2+4}{2}=3$。$y=-(3)^2+6(3)-8=-9+18-8=1$。頂点は $(3,1)$。'
  },
  {
    q: '頂点が $(1,-2)$ で、点 $(0,1)$ を通る二次関数はどれか。\n（R5-2 類題）',
    src: 'R5-2',
    choices: [
      '$y=3(x+1)^2-2$',
      '$y=-3(x-1)^2-2$',
      '$y=3(x-1)^2-2$',
      '$y=-3(x+1)^2+2$'
    ],
    ans: 2,
    exp: '頂点 $(1,-2)$ より $y=m(x-1)^2-2$。$(0,1)$ を代入：$1=m(0-1)^2-2=m-2$ より $m=3$。$y=3(x-1)^2-2$。'
  },
  {
    q: '$y=2x^2$ を $x$ 軸方向に $3$、$y$ 軸方向に $4$ だけ平行移動した式はどれか。\n（R4-2 類題）',
    src: 'R4-2',
    choices: [
      '$y=2(x+3)^2+4$',
      '$y=2x^2+4$',
      '$y=2(x-3)^2-4$',
      '$y=2(x-3)^2+4$'
    ],
    ans: 3,
    exp: '$x$ 軸方向に $3$ 平行移動 $\\Rightarrow x$ を $x-3$ に置き換え。$y$ 軸方向に $4$ 平行移動 $\\Rightarrow +4$。$y=2(x-3)^2+4$。'
  }
];

let cur = 0, correct = 0, answered = false;
const order = [...Array(QUIZ.length).keys()]; // 順番通り

// $...$ をkatex.renderToStringで直接HTMLに変換
function tex(str) {
  if (!window.katex) return str;
  return str.replace(/\$\$(.+?)\$\$/gs, (_, m) => {
    try { return katex.renderToString(m, {throwOnError:false, displayMode:true}); } catch(e){ return _; }
  }).replace(/\$(.+?)\$/gs, (_, m) => {
    try { return katex.renderToString(m, {throwOnError:false, displayMode:false}); } catch(e){ return _; }
  });
}

function doRender() {
  if (!window._katexReady) { window._katexPending = true; return; }
  document.querySelectorAll('.math-render').forEach(el => {
    el.innerHTML = tex(el.innerHTML);
    el.classList.remove('math-render');
  });
}

function buildQuestion(idx) {
  const q = QUIZ[order[idx]];
  const area = document.getElementById('quizArea');
  area.innerHTML = `
  <div class="q-wrap active" id="qWrap">
    <div class="q-header">第 ${idx+1} 問 / 全 ${QUIZ.length} 問</div>
    <div class="q-text math-render">
      ${q.q.replace(/\n/g,'\lt br\gt ')}
      \lt div class="source"\gt 出典：${q.src}</div>
    </div>
    <div class="choices">
      ${q.choices.map((c,ci)=\gt `
        \lt button class="choice-btn math-render" onclick="onAnswer(${ci})">${c}\lt /button\gt 
      `).join('')}
    \lt /div\gt 
    \lt div class="explanation math-render" id="expBox"\gt 
      \lt div class="ex-title"\gt 📝 解説\lt /div\gt 
      ${q.exp}
    </div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">
      ${idx \lt  QUIZ.length-1 ? '次の問題へ →' : '結果を見る →'}
    \lt /button\gt 
  \lt /div\gt `;
  answered = false;
  updateProg(idx);
  doRender();
}

function onAnswer(ci) {
  if (answered) return;
  answered = true;
  const q = QUIZ[order[cur]];
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((b,i) =\gt  {
    b.disabled = true;
    if (i === q.ans) b.classList.add(ci === q.ans ? 'correct' : 'show-correct');
    if (i === ci && ci !== q.ans) b.classList.add('wrong');
  });
  if (ci === q.ans) correct++;
  document.getElementById('expBox').classList.add('show');
  const nb = document.getElementById('nextBtn');
  nb.classList.add('show');
  doRender();
}

function nextQ() {
  cur++;
  if (cur \gt = QUIZ.length) { showResult(); return; }
  buildQuestion(cur);
}

function updateProg(idx) {
  const pct = Math.round(idx / QUIZ.length * 100);
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progLabel').textContent = `${idx} / ${QUIZ.length} 問`;
}

function showResult() {
  document.getElementById('quizArea').style.display = 'none';
  const rs = document.getElementById('resultScreen');
  rs.classList.add('active');
  const pct = Math.round(correct / QUIZ.length * 100);
  const pass = correct \gt = 4;
  let msg, sub;
  if (correct === QUIZ.length) { msg = '🎉 満点！完璧です！'; sub = '二次関数の過去問はバッチリです！'; }
  else if (correct \gt = 4)       { msg = '👍 合格！よくできました'; sub = 'もう少し練習すれば完璧です！'; }
  else if (correct \gt = 3)       { msg = '📖 もう少し！'; sub = '解説をよく読んでもう一度挑戦しよう。'; }
  else                         { msg = '💪 復習が必要です'; sub = 'practice.html で各問題をもう一度確認しよう。'; }

  rs.innerHTML = `
    \lt div class="result-circle"\gt 
      \lt div class="result-score"\gt ${correct}</div>
      <div class="result-total">/ ${QUIZ.length}\lt /div\gt 
    \lt /div\gt 
    \lt div class="result-msg"\gt ${msg}</div>
    <div class="result-sub">${sub}\lt /div\gt 
    \lt div class="btn-row"\gt 
      \lt button class="btn-retry" onclick="retry()"\gt 🔁 もう一度\lt /button\gt 
      \lt a class="btn-back" href="practice.html"\gt ← 演習に戻る\lt /a\gt 
      \lt a class="btn-back" href="../gamba_kounin.html"\gt 🏠 メニューへ\lt /a\gt 
    \lt /div\gt `;

  if (pass) {
    if (typeof markPassed === 'function') markPassed('QU05');
    launchConfetti();
  }
}

function retry() {
  cur = 0; correct = 0; answered = false;
  document.getElementById('resultScreen').classList.remove('active');
  document.getElementById('quizArea').style.display = '';
  buildQuestion(0);
}

// 花吹雪
function launchConfetti() {
  const colors = ['#d97706','#f59e0b','#fbbf24','#059669','#0284c7','#9333ea'];
  for (let i = 0; i \lt  60; i++) {
    const el = document.createElement('div');
    el.className = 'confetti-piece';
    el.style.cssText = `
      left:${Math.random()*100}vw;
      background:${colors[Math.floor(Math.random()*colors.length)]};
      animation:fall ${1.5+Math.random()*2}s ease ${Math.random()*1.5}s forwards;
      transform:rotate(${Math.random()*360}deg)`;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 4000);
  }
}
const style = document.createElement('style');
style.textContent = `@keyframes fall{0%{top:-10px;opacity:.9}100%{top:110vh;opacity:0}}`;
document.head.appendChild(style);

buildQuestion(0);
</script>
</body>
</html>
