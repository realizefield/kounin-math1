<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QU07 x軸との共有点 ③ 練習</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic',sans-serif;background:#fafaf9;color:#1c1917;font-size:16px;line-height:1.7;}
.header{background:#d97706;color:white;padding:14px 20px;}
.header h1{font-size:1.1rem;font-weight:700;}
.header p{font-size:0.85rem;opacity:0.9;margin-top:2px;}
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.card h2{font-size:1rem;font-weight:700;color:#d97706;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #fde68a;}
.step-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.step-btn{flex:1;min-width:80px;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:0.78rem;cursor:pointer;font-weight:700;}
.step-btn.active{background:#d97706;color:white;}
.step-btn.done{background:#d1fae5;color:#065f46;}
.step-btn.inactive{background:#f5f5f4;color:#a8a29e;}
.set-selector{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.set-btn{flex:1;padding:10px 4px;border:2px solid #e7e5e4;border-radius:8px;font-family:inherit;font-size:0.85rem;font-weight:700;cursor:pointer;background:white;}
.set-btn.active{border-color:#d97706;background:#fffbeb;color:#92400e;}
.problem-box{background:#fffbeb;border:1px solid #fde68a;border-radius:8px;padding:12px;margin-bottom:8px;font-size:0.93rem;}
canvas{display:block;margin:6px auto;}
.choices{display:flex;flex-direction:column;gap:8px;margin:10px 0;}
.choice-btn{padding:12px 14px;border:2px solid #e7e5e4;border-radius:8px;font-family:inherit;font-size:0.9rem;cursor:pointer;background:white;text-align:left;}
.choice-btn:hover{border-color:#d97706;background:#fffbeb;}
.choice-btn.correct{border-color:#10b981;background:#d1fae5;color:#065f46;font-weight:700;}
.choice-btn.wrong{border-color:#ef4444;background:#fee2e2;color:#b91c1c;}
.choice-btn.reveal{border-color:#10b981;background:#f0fdf4;font-weight:700;}
.feedback{padding:10px 14px;border-radius:8px;font-size:0.9rem;margin-top:8px;}
.feedback.ok{background:#d1fae5;color:#065f46;}
.feedback.ng{background:#fee2e2;color:#b91c1c;}
.progress{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.prog-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.75rem;font-weight:700;background:#f5f5f4;color:#a8a29e;}
.prog-dot.ok{background:#d1fae5;color:#065f46;}
.prog-dot.ng{background:#fee2e2;color:#b91c1c;}
.prog-dot.cur{background:#fde68a;color:#92400e;}
.toggle-btn{background:#f5f5f4;border:1px solid #d6d3d1;border-radius:8px;padding:7px 14px;font-family:inherit;font-size:0.85rem;cursor:pointer;margin-top:6px;}
.hidden{display:none;}
.sol-text{font-size:0.88rem;line-height:1.7;color:#292524;margin-top:8px;background:#f8f8f7;border-radius:8px;padding:10px 12px;}
.next-btn{padding:9px 22px;background:#059669;color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:10px;display:none;}
.nav-btn{display:block;width:100%;padding:14px;background:#d97706;color:white;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;margin-top:8px;}
.nav-btn:hover{background:#b45309;}
.back-link{display:block;text-align:center;color:#a8a29e;font-size:0.85rem;margin-top:14px;text-decoration:none;}
.back-link:hover{color:#d97706;}
</style>
</head>
<body>
<div class="header">
  <h1>QU07 ③ 練習 ― x軸との共有点の座標</h1>
  <p>第4章 二次関数 ／ 難易度 ★★☆</p>
</div>
<div class="container">
  <div class="step-nav">
    <button class="step-btn done" onclick="location.href='intro.html'">①導入</button>
    <button class="step-btn done" onclick="location.href='example.html'">②例題</button>
    <button class="step-btn active">③練習</button>
    <button class="step-btn inactive" onclick="location.href='check.html'">④確認</button>
  </div>
  <div class="set-selector" id="setSelector">
    <button class="set-btn active" onclick="loadSet(0,this)">セットA</button>
    <button class="set-btn" onclick="loadSet(1,this)">セットB</button>
    <button class="set-btn" onclick="loadSet(2,this)">セットC</button>
    <button class="set-btn" onclick="loadSet(3,this)">セットD</button>
  </div>
  <div class="progress" id="progress"></div>
  <div class="card" id="qCard">
    <h2 id="qTitle">問題</h2>
    <div class="problem-box" id="qText"></div>
    <canvas id="qCanvas" width="300" height="150"></canvas>
    <div class="choices" id="choicesArea"></div>
    <div id="feedback"></div>
    <button class="toggle-btn hidden" id="solBtn" onclick="toggleSol()">解説を見る</button>
    <div class="hidden sol-text" id="solArea"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQ()">次へ →</button>
  </div>
  <button class="nav-btn" onclick="location.href='check.html'">④ 確認テストへ →</button>
  <a href="../gamba_kounin.html" class="back-link">← メニューに戻る</a>
</div>
<script>
function k(e){return katex.renderToString(e,{throwOnError:false});}

// 選択肢テキスト内の分数をCSS縦型分数に変換
function fmtChoice(str){
  const fc='display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;font-size:0.85em;line-height:1.2;margin:0 2px;';
  const nc='border-bottom:1.5px solid currentColor;padding:0 2px;';
  const dc='padding:0 2px;';
  return str.replace(/(−?)(\d+)\/(\d+)/g, function(match, minus, num, den){
    const sign = minus === '−' ? '−' : '';
    return sign+'<span style="'+fc+'"><span style="'+nc+'">'+num+'</span><span style="'+dc+'">'+den+'</span></span>';
  });
}

// 各問: fn=放物線, r1/r2=根(分数はp/q形式), ansIdx, choices[], sol
const sets=[
[
  {label:'A-1', fn:x=>x*x+x-6, r1:[-3,1], r2:[2,1],
   ansIdx:1, choices:['x＝3 と x＝−2','x＝−3 と x＝2','x＝3 と x＝2','x＝−3 と x＝−2'],
   fnStr:'y=x^2+x-6', sol:'x²+x−6=(x+3)(x−2)=0 → x=−3, 2'},
  {label:'A-2', fn:x=>x*x-5*x+6, r1:[2,1], r2:[3,1],
   ansIdx:0, choices:['x＝2 と x＝3','x＝−2 と x＝3','x＝2 と x＝−3','x＝−2 と x＝−3'],
   fnStr:'y=x^2-5x+6', sol:'x²−5x+6=(x−2)(x−3)=0 → x=2, 3'},
  {label:'A-3', fn:x=>2*x*x+5*x-3, r1:[-3,1], r2:[1,2],
   ansIdx:2, choices:['x＝3 と x＝−1/2','x＝−3 と x＝−1/2','x＝1/2 と x＝−3','x＝−1/2 と x＝3'],
   fnStr:'y=2x^2+5x-3', sol:'2x²+5x−3=(2x−1)(x+3)=0 → x=1/2, −3'},
  {label:'A-4', fn:x=>3*x*x+5*x-2, r1:[-2,1], r2:[1,3],
   ansIdx:3, choices:['x＝2 と x＝−1/3','x＝−2 と x＝−1/3','x＝1/3 と x＝2','x＝1/3 と x＝−2'],
   fnStr:'y=3x^2+5x-2', sol:'3x²+5x−2=(3x−1)(x+2)=0 → x=1/3, −2'},
],
[
  {label:'B-1', fn:x=>x*x-x-6, r1:[-2,1], r2:[3,1],
   ansIdx:0, choices:['x＝−2 と x＝3','x＝2 と x＝3','x＝−2 と x＝−3','x＝2 と x＝−3'],
   fnStr:'y=x^2-x-6', sol:'x²−x−6=(x+2)(x−3)=0 → x=−2, 3'},
  {label:'B-2', fn:x=>x*x+2*x-8, r1:[-4,1], r2:[2,1],
   ansIdx:1, choices:['x＝4 と x＝−2','x＝−4 と x＝2','x＝4 と x＝2','x＝−4 と x＝−2'],
   fnStr:'y=x^2+2x-8', sol:'x²+2x−8=(x+4)(x−2)=0 → x=−4, 2'},
  {label:'B-3', fn:x=>2*x*x-7*x+3, r1:[1,2], r2:[3,1],
   ansIdx:2, choices:['x＝−1/2 と x＝3','x＝1/2 と x＝−3','x＝1/2 と x＝3','x＝−1/2 と x＝−3'],
   fnStr:'y=2x^2-7x+3', sol:'(2x−1)(x−3)=0 → x=1/2, 3'},
  {label:'B-4', fn:x=>3*x*x-7*x+2, r1:[1,3], r2:[2,1],
   ansIdx:3, choices:['x＝3 と x＝−2','x＝−1/3 と x＝2','x＝3 と x＝2','x＝1/3 と x＝2'],
   fnStr:'y=3x^2-7x+2', sol:'(3x−1)(x−2)=0 → x=1/3, 2'},
],
[
  {label:'C-1', fn:x=>2*x*x+11*x+5, r1:[-5,1], r2:[-1,2],
   ansIdx:0, choices:['x＝−5 と x＝−1/2','x＝5 と x＝1/2','x＝−5 と x＝1/2','x＝5 と x＝−1/2'],
   fnStr:'y=2x^2+11x+5', sol:'(2x+1)(x+5)=0 → x=−1/2, −5'},
  {label:'C-2', fn:x=>3*x*x+8*x-3, r1:[-3,1], r2:[1,3],
   ansIdx:1, choices:['x＝−3 と x＝−1/3','x＝−3 と x＝1/3','x＝3 と x＝1/3','x＝3 と x＝−1/3'],
   fnStr:'y=3x^2+8x-3', sol:'(3x−1)(x+3)=0 → x=1/3, −3'},
  {label:'C-3', fn:x=>2*x*x+x-6, r1:[-2,1], r2:[3,2],
   ansIdx:2, choices:['x＝2 と x＝−3/2','x＝−2 と x＝−3/2','x＝3/2 と x＝−2','x＝−3/2 と x＝2'],
   fnStr:'y=2x^2+x-6', sol:'(2x−3)(x+2)=0 → x=3/2, −2'},
  {label:'C-4（先生テキスト例題）', fn:x=>6*x*x+7*x-3, r1:[-3,2], r2:[1,3],
   ansIdx:3, choices:['x＝3/2 と x＝1/3','x＝−1/3 と x＝3/2','x＝1/3 と x＝3/2','x＝1/3 と x＝−3/2'],
   fnStr:'y=6x^2+7x-3', sol:'(3x−1)(2x+3)=0 → x=1/3, −3/2'},
],
[
  {label:'D-1（R7-2類似）', fn:x=>2*x*x-11*x+5, r1:[1,2], r2:[5,1],
   ansIdx:0, choices:['x＝1/2 と x＝5','x＝−1/2 と x＝5','x＝1/2 と x＝−5','x＝2 と x＝5'],
   fnStr:'y=2x^2-11x+5', sol:'(2x−1)(x−5)=0 → x=1/2, 5'},
  {label:'D-2（R5-2類似）', fn:x=>3*x*x-8*x+5, r1:[1,1], r2:[5,3],
   ansIdx:1, choices:['x＝1 と x＝3/5','x＝1 と x＝5/3','x＝−1 と x＝5/3','x＝3 と x＝5'],
   fnStr:'y=3x^2-8x+5', sol:'(3x−5)(x−1)=0 → x=5/3, 1'},
  {label:'D-3（R5-1類似）', fn:x=>3*x*x-7*x+2, r1:[1,3], r2:[2,1],
   ansIdx:2, choices:['x＝3 と x＝2','x＝−1/3 と x＝2','x＝1/3 と x＝2','x＝1/3 と x＝−2'],
   fnStr:'y=3x^2-7x+2', sol:'(3x−1)(x−2)=0 → x=1/3, 2'},
  {label:'D-4（R4-1類似）', fn:x=>2*x*x-x-6, r1:[-3,2], r2:[2,1],
   ansIdx:3, choices:['x＝3/2 と x＝2','x＝−3/2 と x＝−2','x＝3/2 と x＝−2','x＝−3/2 と x＝2'],
   fnStr:'y=2x^2-x-6', sol:'(2x+3)(x−2)=0 → x=−3/2, 2'},
],
];

let curSet=0, curQ=0, results=[];

function loadSet(idx,btn){
  curSet=idx; curQ=0; results=[];
  document.querySelectorAll('.set-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  renderQ();
}

function renderProgress(){
  const prog=document.getElementById('progress');
  prog.innerHTML=sets[curSet].map((q,i)=>{
    let c='prog-dot';
    if(i<results.length) c+=results[i]?' ok':' ng';
    else if(i===curQ) c+=' cur';
    return `<div class="${c}">${i+1}</div>`;
  }).join('');
}

function renderQ(){
  const q=sets[curSet][curQ];
  renderProgress();
  document.getElementById('qTitle').textContent=`問${curQ+1}（${q.label}）`;
  document.getElementById('qText').innerHTML='2次関数 '+k(q.fnStr)+' のグラフとx軸との共有点のx座標を求めよ。';
  document.getElementById('feedback').innerHTML='';
  document.getElementById('nextBtn').style.display='none';
  document.getElementById('solBtn').classList.add('hidden');
  document.getElementById('solArea').classList.add('hidden');
  drawGraph(q);
  const labels=['①','②','③','④'];
  document.getElementById('choicesArea').innerHTML=q.choices.map((c,i)=>
    `<button class="choice-btn" onclick="choose(${i},this)">${labels[i]}　${fmtChoice(c)}</button>`
  ).join('');
}

function drawGraph(q){
  const cv=document.getElementById('qCanvas');
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const r0v=q.r1[0]/q.r1[1], r1v=q.r2[0]/q.r2[1];
  const mL=32,mR=24,mT=14,mB=20;
  const allY=[]; for(let x=r0v-0.5;x<=r1v+0.5;x+=0.05) allY.push(q.fn(x));
  const ylo=Math.min(...allY),yhi=Math.max(...allY);
  const xspan=r1v-r0v+1;
  function px(x){return mL+(x-r0v+0.5)/xspan*(W-mL-mR);}
  function py(y){return mT+(yhi-y)/(yhi-ylo||1)*(H-mT-mB);}
  ctx.clearRect(0,0,W,H);
  if(py(0)>mT&&py(0)<H-mB){
    ctx.strokeStyle='#d6d3d1';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(mL-6,py(0));ctx.lineTo(W-mR+6,py(0));ctx.stroke();
  }
  ctx.strokeStyle='#d97706';ctx.lineWidth=2.5;ctx.beginPath();
  let gs=false;
  for(let x=r0v-0.5;x<=r1v+0.5;x+=0.04){
    const y=q.fn(x);const qy=py(y);
    if(qy<-8||qy>H+8){gs=false;continue;}
    if(!gs){ctx.moveTo(px(x),qy);gs=true;} else ctx.lineTo(px(x),qy);
  }
  ctx.stroke();
  // 共有点●
  [r0v,r1v].forEach(r=>{
    ctx.fillStyle='#b45309';ctx.beginPath();ctx.arc(px(r),py(0),5,0,Math.PI*2);ctx.fill();
  });
}


function choose(idx,btn){
  const q=sets[curSet][curQ];
  const ok=(idx===q.ansIdx);
  results.push(ok);
  renderProgress();
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.ansIdx) b.classList.add('reveal');
    else if(b===btn&&!ok) b.classList.add('wrong');
  });
  document.getElementById('feedback').innerHTML=ok
    ?`<div class="feedback ok">✅ 正解！</div>`
    :`<div class="feedback ng">❌ 不正解。正解は「${q.choices[q.ansIdx]}」です。</div>`;
  document.getElementById('nextBtn').style.display='';
  document.getElementById('solBtn').classList.remove('hidden');
  document.getElementById('solArea').innerHTML='<p>'+q.sol+'</p>';
}

function toggleSol(){
  const sa=document.getElementById('solArea');
  const btn=document.getElementById('solBtn');
  sa.classList.toggle('hidden');
  btn.textContent=sa.classList.contains('hidden')?'解説を見る':'解説を隠す';
}

function nextQ(){
  curQ++;
  if(curQ>=sets[curSet].length){
    const sc=results.filter(r=>r).length;
    document.getElementById('qCard').innerHTML=`<h2>セット終了！</h2><p style="margin:10px 0">正解 <strong>${sc} / ${sets[curSet].length}</strong> 問</p>${sc===sets[curSet].length?'<p style="color:#059669;font-weight:700">🎉 全問正解！</p>':''}<button style="padding:9px 22px;background:#d97706;color:white;border:none;border-radius:8px;font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;margin-top:14px;" onclick="loadSet(${curSet},document.querySelectorAll('.set-btn')[${curSet}])">もう一度</button>`;
  } else renderQ();
}

renderQ();
</script>
</body>
</html>
