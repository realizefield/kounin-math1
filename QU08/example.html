<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QU08 判別式 ② 例題</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic',sans-serif;background:#fafaf9;color:#1c1917;font-size:16px;line-height:1.7;}
.header{background:#d97706;color:white;padding:14px 20px;}
.header h1{font-size:1.1rem;font-weight:700;}
.header p{font-size:0.85rem;opacity:0.9;margin-top:2px;}
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.card h2{font-size:1rem;font-weight:700;color:#d97706;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #fde68a;}
.step-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.step-btn{flex:1;min-width:80px;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:0.78rem;cursor:pointer;font-weight:700;}
.step-btn.active{background:#d97706;color:white;}
.step-btn.done{background:#d1fae5;color:#065f46;}
.step-btn.inactive{background:#f5f5f4;color:#a8a29e;}
.problem-box{background:#fffbeb;border:2px solid #d97706;border-radius:10px;padding:14px;margin-bottom:12px;font-size:0.95rem;}
canvas{display:block;margin:8px auto;}
.toggle-btn{background:#f5f5f4;border:1px solid #d6d3d1;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:0.88rem;cursor:pointer;margin-top:10px;}
.hidden{display:none;}
.sol-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.sol-num{background:#d97706;color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;margin-top:2px;}
.sol-text{font-size:0.92rem;line-height:1.7;}
.answer-box{background:#fef3c7;border-radius:8px;padding:12px 14px;margin-top:10px;font-weight:700;color:#92400e;font-size:0.93rem;}
.nav-btn{display:block;width:100%;padding:14px;background:#d97706;color:white;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;margin-top:8px;}
.nav-btn:hover{background:#b45309;}
.back-link{display:block;text-align:center;color:#a8a29e;font-size:0.85rem;margin-top:14px;text-decoration:none;}
.back-link:hover{color:#d97706;}
</style>
</head>
<body>
<div class="header">
  <h1>QU08 ② 例題 ― 判別式とx軸との共有点の個数</h1>
  <p>第4章 二次関数 ／ 難易度 ★★☆</p>
</div>
<div class="container">
  <div class="step-nav">
    <button class="step-btn done" onclick="location.href='QU08_intro.html'">①導入</button>
    <button class="step-btn active">②例題</button>
    <button class="step-btn inactive" onclick="location.href='QU08_drill.html'">③練習</button>
    <button class="step-btn inactive" onclick="location.href='QU08_check.html'">④確認</button>
  </div>

  <!-- 例題1: 個数を求める -->
  <div class="card">
    <h2>【例題1】共有点の個数を求める（R7-1 類似）</h2>
    <div class="problem-box"><p id="p1"></p></div>
    <canvas id="cv1" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s1',this)">解答・解説を見る</button>
    <div id="s1" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><strong>a, b, c を読み取る</strong><br><span id="s1a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>D を計算</strong><br><span id="s1b"></span></div></div>
      <div class="sol-step"><div class="sol-num">3</div>
        <div class="sol-text"><strong>D の値から判断</strong><br><span id="s1c"></span></div></div>
      <div class="answer-box" id="a1"></div>
    </div>
  </div>

  <!-- 例題2: 接するときのmの値 -->
  <div class="card">
    <h2>【例題2】x軸に接するときの定数を求める（先生テキスト例題3）</h2>
    <div class="problem-box"><p id="p2"></p></div>
    <canvas id="cv2" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s2',this)">解答・解説を見る</button>
    <div id="s2" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><strong>「接する」→ D = 0</strong><br><span id="s2a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>D の式を立てる</strong><br><span id="s2b"></span></div></div>
      <div class="sol-step"><div class="sol-num">3</div>
        <div class="sol-text"><strong>m を求める</strong><br><span id="s2c"></span></div></div>
      <div class="answer-box" id="a2"></div>
    </div>
  </div>

  <!-- 例題3: D<0 の確認 -->
  <div class="card">
    <h2>【例題3】交点の個数を確認する（R6-2 類似）</h2>
    <div class="problem-box"><p id="p3"></p></div>
    <canvas id="cv3" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s3',this)">解答・解説を見る</button>
    <div id="s3" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><span id="s3a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><span id="s3b"></span></div></div>
      <div class="answer-box" id="a3"></div>
    </div>
  </div>

  <button class="nav-btn" onclick="location.href='QU08_drill.html'">③ 練習へ進む →</button>
  <a href="../gamba_kounin.html" class="back-link">← メニューに戻る</a>
</div>

<script>
function k(e){return katex.renderToString(e,{throwOnError:false});}
function tog(id,btn){
  const el=document.getElementById(id);el.classList.toggle('hidden');
  btn.textContent=el.classList.contains('hidden')?'解答・解説を見る':'解答・解説を隠す';
}

// 例題1: y=x²−6x+9
document.getElementById('p1').innerHTML='2次関数 '+k('y=x^2-6x+9')+' のグラフとx軸との共有点の個数を求めよ。';
document.getElementById('s1a').innerHTML=k('a=1,\\;b=-6,\\;c=9');
document.getElementById('s1b').innerHTML=k('D=(-6)^2-4\\times1\\times9=36-36=0');
document.getElementById('s1c').innerHTML='D = 0 なので → 共有点は <strong>1個</strong>（x軸に接する）';
document.getElementById('a1').innerHTML='答）共有点の個数：'+k('1')+'個（x軸に接する）';

// 例題2: y=2x²+12x+m
document.getElementById('p2').innerHTML='2次関数 '+k('y=2x^2+12x+m')+' のグラフがx軸に接するとき、定数 '+k('m')+' の値を求めよ。';
document.getElementById('s2a').innerHTML='「接する」は D = 0 を意味する。'+k('a=2,\\;b=12,\\;c=m');
document.getElementById('s2b').innerHTML=k('D=12^2-4\\times2\\times m=144-8m=0');
document.getElementById('s2c').innerHTML=k('8m=144 \\Rightarrow m=18');
document.getElementById('a2').innerHTML='答）'+k('m=18');

// 例題3: y=x²−2x+2
document.getElementById('p3').innerHTML='2次関数 '+k('y=x^2-2x+2')+' のグラフとx軸との共有点の個数を求めよ。';
document.getElementById('s3a').innerHTML=k('a=1,\\;b=-2,\\;c=2')+'　→ '+k('D=(-2)^2-4\\times1\\times2=4-8=-4');
document.getElementById('s3b').innerHTML='D = −4 < 0 なので → 共有点は <strong>0個</strong>（x軸と交わらない）';
document.getElementById('a3').innerHTML='答）共有点の個数：'+k('0')+'個（x軸と交点なし）';

// グラフ
function drawD(id, f, D, color){
  const cv=document.getElementById(id);
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  // 頂点探し
  let vx=0, vy=Infinity;
  for(let x=-5;x<=5;x+=0.1){const y=f(x);if(y<vy){vy=y;vx=x;}}
  const sc=32;
  const ox=W/2-vx*sc;
  const oy=H*0.6-vy*sc*0.5;
  function px(x){return ox+x*sc;}
  function py(y){return oy-y*sc;}
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#d6d3d1';ctx.lineWidth=1;
  if(oy>4&&oy<H-4){ctx.beginPath();ctx.moveTo(8,oy);ctx.lineTo(W-8,oy);ctx.stroke();}
  ctx.strokeStyle=color;ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=vx-3;x<=vx+3;x+=0.05){
    const y=f(x);if(py(y)<-10||py(y)>H+10)continue;
    x===vx-3?ctx.moveTo(px(x),py(y)):ctx.lineTo(px(x),py(y));
  }
  ctx.stroke();
  // D表示
  ctx.fillStyle=color;ctx.font='bold 13px BIZ UDPGothic';
  const dStr=D>0?'D>0 (2点)':D===0?'D=0 (接)':'D<0 (0点)';
  ctx.fillText(dStr,10,20);
}
drawD('cv1',x=>x*x-6*x+9,0,'#10b981');
drawD('cv2',x=>2*x*x+12*x+18,0,'#10b981');
drawD('cv3',x=>x*x-2*x+2,-4,'#ef4444');
</script>
</body>
</html>
