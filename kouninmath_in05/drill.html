<style>
:root{
  --primary:#1d4ed8;
  --primary-light:#dbeafe;
  --primary-mid:#3b82f6;
  --accent:#e8372d;
  --accent-light:#fff1f0;
  --success:#16a34a;
  --success-light:#dcfce7;
  --warn:#d97706;
  --warn-light:#fffbeb;
  --bg:#f0f6ff;
  --card:#ffffff;
  --border:#bfdbfe;
  --text:#1e293b;
  --text-sub:#64748b;
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;line-height:1.7;}
.g-container{max-width:760px;margin:0 auto;}
.page-header{background:var(--primary);color:#fff;padding:18px 24px 14px;text-align:center;box-shadow:0 3px 10px rgba(29,78,216,.25);}
.page-header .unit-code{font-size:.82em;opacity:.85;letter-spacing:.1em;margin-bottom:4px;}
.page-header h1{font-size:clamp(1.1em,3vw,1.55em);font-weight:700;margin:0;}

.step-nav{display:flex;align-items:center;justify-content:center;padding:14px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:10;}
.step-item{display:flex;align-items:center;gap:6px;font-size:clamp(.75em,2vw,.88em);color:#94a3b8;white-space:nowrap;padding:4px 6px;}
.step-item a{color:inherit;text-decoration:none;}
.step-item.active{color:var(--primary);font-weight:700;}
.step-circle{width:22px;height:22px;border-radius:50%;font-size:.76em;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-item.active .step-circle{background:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-light);}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:1.1em;padding:0 2px;user-select:none;}

.content{padding:20px 16px 40px;}
.intro-lead{background:var(--primary-light);border-left:4px solid var(--primary);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:18px;color:var(--primary);font-size:.94em;}

.kw-cond{color:var(--accent);font-weight:700;}
.kw-num{background:linear-gradient(transparent 60%,#fff3a0 60%);font-weight:700;padding:0 2px;}

.set-selector{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.set-selector label{font-weight:700;color:var(--primary);font-size:.95em;}
.set-selector select{padding:8px 14px;border:2px solid var(--primary);border-radius:8px;font-size:.95em;background:#fff;color:var(--primary);font-weight:700;font-family:inherit;cursor:pointer;flex:1;min-width:120px;}
.set-selector .reload-btn{padding:8px 14px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer;font-size:.9em;font-family:inherit;}
.set-selector .reload-btn:hover{background:var(--primary-mid);}

.qcard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.qcard-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qcard-num{background:var(--primary);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;flex-shrink:0;}
.qcard-year{color:var(--accent);background:var(--accent-light);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.82em;}
.qcard-pattern{color:var(--primary);background:var(--primary-light);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.82em;}

.q-statement{background:#f8fafc;border-left:3px solid var(--primary-mid);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.93em;line-height:1.85;margin-bottom:12px;}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.choice-btn{padding:10px 12px;background:#fff;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;font-size:.95em;text-align:center;transition:all .15s;}
.choice-btn:hover{background:var(--primary-light);border-color:var(--primary);}
.choice-btn.correct{background:var(--success);color:#fff;border-color:var(--success);}
.choice-btn.wrong{background:var(--accent);color:#fff;border-color:var(--accent);}
.choice-btn:disabled{cursor:default;}

.result-panel{display:none;margin-top:12px;padding:14px;border-radius:8px;font-size:.92em;line-height:1.75;}
.result-panel.ok{background:var(--success-light);border:1.5px solid var(--success);}
.result-panel.ng{background:var(--accent-light);border:1.5px solid var(--accent);}
.result-panel .verdict{font-weight:700;font-size:1.02em;margin-bottom:10px;}
.result-panel.ok .verdict{color:var(--success);}
.result-panel.ng .verdict{color:var(--accent);}

.sol-title{font-weight:700;color:var(--primary);font-size:.92em;background:var(--primary-light);padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:10px;}

.sol-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
.sol-num{background:var(--primary);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78em;flex-shrink:0;line-height:1;}
.sol-body{flex:1;background:#fff;padding:8px 12px;border-radius:6px;border:1px solid var(--border);font-size:.91em;line-height:1.7;color:var(--text);}
.sol-body strong{color:var(--primary);}

.calc-line{background:#f8fafc;border-left:3px solid var(--primary-mid);padding:5px 10px;margin:4px 0;font-size:.9em;color:var(--text);border-radius:0 4px 4px 0;}
.calc-line .op-label{color:var(--text-sub);font-size:.82em;display:inline-block;margin-right:6px;}

.int-note{background:var(--success-light);border-left:3px solid var(--success);padding:6px 10px;margin-top:8px;border-radius:0 4px 4px 0;color:var(--success);font-weight:700;font-size:.9em;}

.score-box{display:none;background:linear-gradient(135deg,#dbeafe 0%,#e0e7ff 100%);border:2px solid var(--primary);border-radius:var(--radius);padding:18px;text-align:center;margin-top:18px;}
.score-box.show{display:block;}
.score-box .score-num{font-size:1.5em;font-weight:700;color:var(--primary);}
.score-box .msg{margin-top:6px;font-size:.95em;}

.btn-row{text-align:center;margin-top:20px;}
.btn-back,.btn-next{display:inline-block;margin:4px;padding:10px 22px;text-decoration:none;border-radius:8px;font-weight:700;font-size:.95em;}
.btn-back{background:#fff;border:2px solid var(--primary);color:var(--primary);}
.btn-back:hover{background:var(--primary-light);}
.btn-next{background:var(--primary);color:#fff;border:2px solid var(--primary);}
.btn-next:hover{background:var(--primary-mid);}
</style>
</head>

<script>
/* ─────────── 解説生成ヘルパー ─────────── */

/* パターン1：以内型 */
function buildUpperSolution(p){
  return `
    <div class="sol-title">📖 以内型の解き方</div>
    <div class="sol-step">
      <span class="sol-num">①</span>
      <div class="sol-body">${p.askName}を $x$ ${p.unit}とおく。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">②</span>
      <div class="sol-body">もう一方は $(${p.total}-x)$ ${p.unit}。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">③</span>
      <div class="sol-body">合計代金：${p.expr}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">④</span>
      <div class="sol-body">予算以内：${p.equation}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">⑤</span>
      <div class="sol-body">
        <div class="calc-line"><span class="op-label">かっこを外す：</span>${p.expand}</div>
        <div class="calc-line"><span class="op-label">整理：</span>${p.simplify}</div>
        <div class="calc-line"><span class="op-label">解く：</span>${p.final}</div>
        <div class="int-note">✅ 整数なので最大 ${p.answer}${p.unit}${p.cutoffNote ? '（小数点以下は切り捨て）' : ''}</div>
      </div>
    </div>
  `;
}

/* パターン2：以上型 */
function buildLowerSolution(p){
  return `
    <div class="sol-title">📖 以上型の解き方</div>
    <div class="sol-step">
      <span class="sol-num">①</span>
      <div class="sol-body">${p.askName}を $x$ ${p.unit}とおく。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">②</span>
      <div class="sol-body">もう一方は $(${p.total}-x)$ ${p.unit}。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">③</span>
      <div class="sol-body">合計代金：${p.expr}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">④</span>
      <div class="sol-body">${p.condName}以上：${p.equation}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">⑤</span>
      <div class="sol-body">
        <div class="calc-line"><span class="op-label">かっこを外す：</span>${p.expand}</div>
        <div class="calc-line"><span class="op-label">整理：</span>${p.simplify}</div>
        <div class="calc-line"><span class="op-label">解く：</span>${p.final}</div>
        <div class="int-note">✅ 整数なので ${p.answer}${p.unit}以上${p.cutoffNote ? '（小数点以下を切り上げ）' : ''}</div>
      </div>
    </div>
  `;
}

/* ─────────── 問題データ ─────────── */
const QUIZ_SETS = {
  /* ════════ Aセット：以内型 ════════ */
  A: [
    /* A1：りんご・みかん */
    {
      pattern:'以内型',
      text:'りんごとみかんを合わせて<span class="kw-num">12個</span>買う。りんご1個<span class="kw-num">130円</span>，みかん1個<span class="kw-num">70円</span>のとき，代金の合計を<span class="kw-num">1200円</span><span class="kw-cond">以内</span>にするには，りんごを最大何個まで買えるか。',
      choices:['5個','6個','7個','8個'],
      ans:1,
      solution: buildUpperSolution({
        askName:'りんごの個数', unit:'個', total:'12',
        expr:'$130x + 70(12-x)$（円）',
        equation:'$130x + 70(12-x) \\leqq 1200$',
        expand:'$130x + 840 - 70x \\leqq 1200$',
        simplify:'$60x + 840 \\leqq 1200$',
        final:'$x \\leqq 6$',
        answer:'6'
      })
    },
    /* A2：ケーキ・クッキー */
    {
      pattern:'以内型',
      text:'ケーキとクッキーを合わせて<span class="kw-num">10個</span>買う。ケーキ1個<span class="kw-num">400円</span>，クッキー1個<span class="kw-num">150円</span>のとき，代金の合計を<span class="kw-num">3000円</span><span class="kw-cond">以内</span>にするには，ケーキを最大何個まで買えるか。',
      choices:['5個','6個','7個','8個'],
      ans:1,
      solution: buildUpperSolution({
        askName:'ケーキの個数', unit:'個', total:'10',
        expr:'$400x + 150(10-x)$（円）',
        equation:'$400x + 150(10-x) \\leqq 3000$',
        expand:'$400x + 1500 - 150x \\leqq 3000$',
        simplify:'$250x + 1500 \\leqq 3000$',
        final:'$x \\leqq 6$',
        answer:'6'
      })
    },
    /* A3：ボールペン・えんぴつ */
    {
      pattern:'以内型',
      text:'ボールペンとえんぴつを合わせて<span class="kw-num">20本</span>買う。ボールペン1本<span class="kw-num">90円</span>，えんぴつ1本<span class="kw-num">50円</span>のとき，代金の合計を<span class="kw-num">1500円</span><span class="kw-cond">以内</span>にするには，ボールペンを最大何本まで買えるか。',
      choices:['11本','12本','13本','14本'],
      ans:1,
      solution: buildUpperSolution({
        askName:'ボールペンの本数', unit:'本', total:'20',
        expr:'$90x + 50(20-x)$（円）',
        equation:'$90x + 50(20-x) \\leqq 1500$',
        expand:'$90x + 1000 - 50x \\leqq 1500$',
        simplify:'$40x + 1000 \\leqq 1500$',
        final:'$x \\leqq 12.5$',
        answer:'12',
        cutoffNote:true
      })
    },
    /* A4：大人・子供チケット */
    {
      pattern:'以内型',
      text:'大人チケットと子供チケットを合わせて<span class="kw-num">8枚</span>買う。大人1枚<span class="kw-num">600円</span>，子供1枚<span class="kw-num">300円</span>のとき，代金の合計を<span class="kw-num">3600円</span><span class="kw-cond">以内</span>にするには，大人チケットを最大何枚まで買えるか。',
      choices:['3枚','4枚','5枚','6枚'],
      ans:1,
      solution: buildUpperSolution({
        askName:'大人チケットの枚数', unit:'枚', total:'8',
        expr:'$600x + 300(8-x)$（円）',
        equation:'$600x + 300(8-x) \\leqq 3600$',
        expand:'$600x + 2400 - 300x \\leqq 3600$',
        simplify:'$300x + 2400 \\leqq 3600$',
        final:'$x \\leqq 4$',
        answer:'4'
      })
    }
  ],

  /* ════════ Bセット：以上型 ════════ */
  B: [
    /* B1：りんご・みかん */
    {
      pattern:'以上型',
      text:'りんごとみかんを合わせて<span class="kw-num">15個</span>買う。りんご1個<span class="kw-num">140円</span>，みかん1個<span class="kw-num">60円</span>のとき，代金の合計を<span class="kw-num">1500円</span><span class="kw-cond">以上</span>にするには，りんごを何個以上買えばよいか。',
      choices:['6個','7個','8個','9個'],
      ans:2,
      solution: buildLowerSolution({
        askName:'りんごの個数', unit:'個', total:'15', condName:'1500円',
        expr:'$140x + 60(15-x)$（円）',
        equation:'$140x + 60(15-x) \\geqq 1500$',
        expand:'$140x + 900 - 60x \\geqq 1500$',
        simplify:'$80x + 900 \\geqq 1500$',
        final:'$x \\geqq 7.5$',
        answer:'8',
        cutoffNote:true
      })
    },
    /* B2：ペットボトル・缶 */
    {
      pattern:'以上型',
      text:'ペットボトルと缶ジュースを合わせて<span class="kw-num">10本</span>買う。ペットボトル1本<span class="kw-num">150円</span>，缶ジュース1本<span class="kw-num">90円</span>のとき，代金の合計を<span class="kw-num">1200円</span><span class="kw-cond">以上</span>にするには，ペットボトルを何本以上買えばよいか。',
      choices:['4本','5本','6本','7本'],
      ans:1,
      solution: buildLowerSolution({
        askName:'ペットボトルの本数', unit:'本', total:'10', condName:'1200円',
        expr:'$150x + 90(10-x)$（円）',
        equation:'$150x + 90(10-x) \\geqq 1200$',
        expand:'$150x + 900 - 90x \\geqq 1200$',
        simplify:'$60x + 900 \\geqq 1200$',
        final:'$x \\geqq 5$',
        answer:'5'
      })
    },
    /* B3：単行本・文庫本 */
    {
      pattern:'以上型',
      text:'単行本と文庫本を合わせて<span class="kw-num">6冊</span>買う。単行本1冊<span class="kw-num">500円</span>，文庫本1冊<span class="kw-num">300円</span>のとき，代金の合計を<span class="kw-num">2400円</span><span class="kw-cond">以上</span>にするには，単行本を何冊以上買えばよいか。',
      choices:['2冊','3冊','4冊','5冊'],
      ans:1,
      solution: buildLowerSolution({
        askName:'単行本の冊数', unit:'冊', total:'6', condName:'2400円',
        expr:'$500x + 300(6-x)$（円）',
        equation:'$500x + 300(6-x) \\geqq 2400$',
        expand:'$500x + 1800 - 300x \\geqq 2400$',
        simplify:'$200x + 1800 \\geqq 2400$',
        final:'$x \\geqq 3$',
        answer:'3'
      })
    },
    /* B4：シャープペン・えんぴつ */
    {
      pattern:'以上型',
      text:'シャープペンとえんぴつを合わせて<span class="kw-num">25本</span>買う。シャープペン1本<span class="kw-num">160円</span>，えんぴつ1本<span class="kw-num">40円</span>のとき，代金の合計を<span class="kw-num">2800円</span><span class="kw-cond">以上</span>にするには，シャープペンを何本以上買えばよいか。',
      choices:['13本','14本','15本','16本'],
      ans:2,
      solution: buildLowerSolution({
        askName:'シャープペンの本数', unit:'本', total:'25', condName:'2800円',
        expr:'$160x + 40(25-x)$（円）',
        equation:'$160x + 40(25-x) \\geqq 2800$',
        expand:'$160x + 1000 - 40x \\geqq 2800$',
        simplify:'$120x + 1000 \\geqq 2800$',
        final:'$x \\geqq 15$',
        answer:'15'
      })
    }
  ],

  /* ════════ Cセット：仕上げ（混合） ════════ */
  C: [
    /* C1：サンドイッチ・おにぎり（以内型） */
    {
      pattern:'以内型',
      text:'サンドイッチとおにぎりを合わせて<span class="kw-num">9個</span>買う。サンドイッチ1個<span class="kw-num">280円</span>，おにぎり1個<span class="kw-num">120円</span>のとき，代金の合計を<span class="kw-num">1800円</span><span class="kw-cond">以内</span>にするには，サンドイッチを最大何個まで買えるか。',
      choices:['3個','4個','5個','6個'],
      ans:1,
      solution: buildUpperSolution({
        askName:'サンドイッチの個数', unit:'個', total:'9',
        expr:'$280x + 120(9-x)$（円）',
        equation:'$280x + 120(9-x) \\leqq 1800$',
        expand:'$280x + 1080 - 120x \\leqq 1800$',
        simplify:'$160x + 1080 \\leqq 1800$',
        final:'$x \\leqq 4.5$',
        answer:'4',
        cutoffNote:true
      })
    },
    /* C2：ペットボトル茶・缶コーヒー（以上型） */
    {
      pattern:'以上型',
      text:'ペットボトル茶と缶コーヒーを合わせて<span class="kw-num">14本</span>買う。ペットボトル茶1本<span class="kw-num">160円</span>，缶コーヒー1本<span class="kw-num">130円</span>のとき，代金の合計を<span class="kw-num">2000円</span><span class="kw-cond">以上</span>にするには，ペットボトル茶を何本以上買えばよいか。',
      choices:['5本','6本','7本','8本'],
      ans:1,
      solution: buildLowerSolution({
        askName:'ペットボトル茶の本数', unit:'本', total:'14', condName:'2000円',
        expr:'$160x + 130(14-x)$（円）',
        equation:'$160x + 130(14-x) \\geqq 2000$',
        expand:'$160x + 1820 - 130x \\geqq 2000$',
        simplify:'$30x + 1820 \\geqq 2000$',
        final:'$x \\geqq 6$',
        answer:'6'
      })
    },
    /* C3：マーカー・消しゴム（以内型） */
    {
      pattern:'以内型',
      text:'マーカーと消しゴムを合わせて<span class="kw-num">11個</span>買う。マーカー1個<span class="kw-num">180円</span>，消しゴム1個<span class="kw-num">70円</span>のとき，代金の合計を<span class="kw-num">1500円</span><span class="kw-cond">以内</span>にするには，マーカーを最大何個まで買えるか。',
      choices:['5個','6個','7個','8個'],
      ans:1,
      solution: buildUpperSolution({
        askName:'マーカーの個数', unit:'個', total:'11',
        expr:'$180x + 70(11-x)$（円）',
        equation:'$180x + 70(11-x) \\leqq 1500$',
        expand:'$180x + 770 - 70x \\leqq 1500$',
        simplify:'$110x + 770 \\leqq 1500$',
        final:'$x \\leqq 6.63\\cdots$',
        answer:'6',
        cutoffNote:true
      })
    },
    /* C4：缶詰B・缶詰A（以上型） */
    {
      pattern:'以上型',
      text:'2種類の缶詰A・Bを合わせて<span class="kw-num">7個</span>買う。缶詰A1個<span class="kw-num">200円</span>，缶詰B1個<span class="kw-num">350円</span>のとき，代金の合計を<span class="kw-num">1900円</span><span class="kw-cond">以上</span>にするには，缶詰Bを何個以上買えばよいか。',
      choices:['3個','4個','5個','6個'],
      ans:1,
      solution: buildLowerSolution({
        askName:'缶詰Bの個数', unit:'個', total:'7', condName:'1900円',
        expr:'$350x + 200(7-x)$（円）',
        equation:'$350x + 200(7-x) \\geqq 1900$',
        expand:'$350x + 1400 - 200x \\geqq 1900$',
        simplify:'$150x + 1400 \\geqq 1900$',
        final:'$x \\geqq 3.33\\cdots$',
        answer:'4',
        cutoffNote:true
      })
    }
  ]
};

let currentSet = 'A';
let answered = [];
let answers = [];

function loadSet(){
  currentSet = document.getElementById('setSel').value;
  const set = QUIZ_SETS[currentSet];
  answered = new Array(set.length).fill(false);
  answers = new Array(set.length).fill(null);
  document.getElementById('scoreBox').classList.remove('show');

  let html = '';
  set.forEach((q, i) => {
    html += `
      <div class="qcard">
        <div class="qcard-head">
          <span class="qcard-num">${i+1}</span>
          <span class="qcard-pattern">${q.pattern}</span>
        </div>
        <div class="q-statement">${q.text}</div>
        <div class="choices" id="choices${i}">
          ${q.choices.map((c,j) =>
            `<button class="choice-btn" onclick="selectChoice(${i},${j})">${j+1}）${c}</button>`
          ).join('')}
        </div>
        <div class="result-panel" id="rp${i}"></div>
      </div>
    `;
  });
  document.getElementById('quizArea').innerHTML = html;

  if(window._katexReady){
    renderArea();
  }else{
    window._onKatexReady = renderArea;
  }
}

function renderArea(){
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(document.getElementById('quizArea'), {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

function selectChoice(qi, ci){
  if(answered[qi]) return;
  answered[qi] = true;
  answers[qi] = ci;

  const q = QUIZ_SETS[currentSet][qi];
  const correct = (ci === q.ans);
  const buttons = document.querySelectorAll(`#choices${qi} .choice-btn`);
  buttons.forEach((b, j) => {
    b.disabled = true;
    if(j === q.ans) b.classList.add('correct');
    else if(j === ci) b.classList.add('wrong');
  });

  const rp = document.getElementById('rp'+qi);
  rp.style.display = 'block';
  rp.className = 'result-panel ' + (correct ? 'ok' : 'ng');
  rp.innerHTML =
    `<div class="verdict">${correct ? '✅ 正解！' : `❌ 不正解…　正解は【${q.ans+1}）${q.choices[q.ans]}】`}</div>`
    + q.solution;

  if(typeof renderMathInElement === 'function'){
    renderMathInElement(rp, {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }

  if(answered.every(v => v)) showScore();
}

function showScore(){
  const set = QUIZ_SETS[currentSet];
  const correct = answers.filter((a, i) => a === set[i].ans).length;
  const box = document.getElementById('scoreBox');
  box.classList.add('show');
  document.getElementById('scoreText').textContent = `${correct} / ${set.length} 問正解`;

  const msgs = [
    'もう一度挑戦💪 例題に戻ろう',
    '惜しい！立式を見直そう📖',
    'いい調子！もう一歩！✨',
    'すごい！ほぼ完璧🌟',
    '満点！この型はバッチリ🎉'
  ];
  document.getElementById('scoreMsg').textContent = msgs[Math.min(correct, set.length)];
}

window.addEventListener('load', () => {
  loadSet();
});
</script>
