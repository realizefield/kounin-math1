<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>IN05 不等式の文章題①｜確認テスト</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="window._katexReady=true; if(window._onKatexReady) window._onKatexReady();"></script>
<script defer src="../gamba_support.js"></script>

<style>
:root{
  --primary:#1d4ed8;
  --primary-light:#dbeafe;
  --primary-mid:#3b82f6;
  --accent:#e8372d;
  --accent-light:#fff1f0;
  --success:#16a34a;
  --success-light:#dcfce7;
  --warn:#d97706;
  --warn-light:#fffbeb;
  --bg:#f0f6ff;
  --card:#ffffff;
  --border:#bfdbfe;
  --text:#1e293b;
  --text-sub:#64748b;
  --radius:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;line-height:1.7;}
.g-container{max-width:760px;margin:0 auto;}
.page-header{background:var(--primary);color:#fff;padding:18px 24px 14px;text-align:center;box-shadow:0 3px 10px rgba(29,78,216,.25);}
.page-header .unit-code{font-size:.82em;opacity:.85;letter-spacing:.1em;margin-bottom:4px;}
.page-header h1{font-size:clamp(1.1em,3vw,1.55em);font-weight:700;margin:0;}

.step-nav{display:flex;align-items:center;justify-content:center;padding:14px 12px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:10;}
.step-item{display:flex;align-items:center;gap:6px;font-size:clamp(.75em,2vw,.88em);color:#94a3b8;white-space:nowrap;padding:4px 6px;}
.step-item a{color:inherit;text-decoration:none;}
.step-item.active{color:var(--primary);font-weight:700;}
.step-circle{width:22px;height:22px;border-radius:50%;font-size:.76em;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-item.active .step-circle{background:var(--primary);color:#fff;box-shadow:0 0 0 3px var(--primary-light);}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:1.1em;padding:0 2px;user-select:none;}

.content{padding:20px 16px 40px;}
.intro-lead{background:var(--primary-light);border-left:4px solid var(--primary);padding:14px 18px;border-radius:0 var(--radius) var(--radius) 0;margin-bottom:18px;color:var(--primary);font-size:.94em;}

.kw-cond{color:var(--accent);font-weight:700;}
.kw-num{background:linear-gradient(transparent 60%,#fff3a0 60%);font-weight:700;padding:0 2px;}

.qcard{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
.qcard-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
.qcard-num{background:var(--primary);color:#fff;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;flex-shrink:0;}
.qcard-pattern{color:var(--primary);background:var(--primary-light);padding:2px 8px;border-radius:6px;font-weight:700;font-size:.82em;}

.q-statement{background:#f8fafc;border-left:3px solid var(--primary-mid);padding:10px 14px;border-radius:0 6px 6px 0;font-size:.93em;line-height:1.85;margin-bottom:12px;}

.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.choice-btn{padding:10px 12px;background:#fff;border:2px solid var(--border);border-radius:8px;cursor:pointer;font-family:inherit;font-size:.95em;text-align:center;transition:all .15s;}
.choice-btn:hover{background:var(--primary-light);border-color:var(--primary);}
.choice-btn.correct{background:var(--success);color:#fff;border-color:var(--success);}
.choice-btn.wrong{background:var(--accent);color:#fff;border-color:var(--accent);}
.choice-btn:disabled{cursor:default;}

.result-panel{display:none;margin-top:12px;padding:14px;border-radius:8px;font-size:.92em;line-height:1.75;}
.result-panel.ok{background:var(--success-light);border:1.5px solid var(--success);}
.result-panel.ng{background:var(--accent-light);border:1.5px solid var(--accent);}
.result-panel .verdict{font-weight:700;font-size:1.02em;margin-bottom:10px;}
.result-panel.ok .verdict{color:var(--success);}
.result-panel.ng .verdict{color:var(--accent);}

.sol-title{font-weight:700;color:var(--primary);font-size:.92em;background:var(--primary-light);padding:6px 10px;border-radius:6px;display:inline-block;margin-bottom:10px;}

.sol-step{display:flex;gap:10px;margin-bottom:8px;align-items:flex-start;}
.sol-num{background:var(--primary);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.78em;flex-shrink:0;line-height:1;}
.sol-body{flex:1;background:#fff;padding:8px 12px;border-radius:6px;border:1px solid var(--border);font-size:.91em;line-height:1.7;color:var(--text);}
.sol-body strong{color:var(--primary);}

.calc-line{background:#f8fafc;border-left:3px solid var(--primary-mid);padding:5px 10px;margin:4px 0;font-size:.9em;color:var(--text);border-radius:0 4px 4px 0;}
.calc-line .op-label{color:var(--text-sub);font-size:.82em;display:inline-block;margin-right:6px;}

.int-note{background:var(--success-light);border-left:3px solid var(--success);padding:6px 10px;margin-top:8px;border-radius:0 4px 4px 0;color:var(--success);font-weight:700;font-size:.9em;}

.score-box{display:none;background:linear-gradient(135deg,#dbeafe 0%,#e0e7ff 100%);border:2px solid var(--primary);border-radius:var(--radius);padding:20px;text-align:center;margin-top:18px;}
.score-box.show{display:block;}
.score-box .score-num{font-size:1.6em;font-weight:700;color:var(--primary);}
.score-box .msg{margin-top:8px;font-size:1em;font-weight:700;}
.score-box .retry-btn{margin-top:12px;padding:10px 28px;background:var(--primary);color:#fff;border:none;border-radius:8px;font-weight:700;font-size:.95em;cursor:pointer;font-family:inherit;}
.score-box .retry-btn:hover{background:var(--primary-mid);}

.btn-row{text-align:center;margin-top:20px;}
.btn-back,.btn-next{display:inline-block;margin:4px;padding:10px 22px;text-decoration:none;border-radius:8px;font-weight:700;font-size:.95em;}
.btn-back{background:#fff;border:2px solid var(--primary);color:var(--primary);}
.btn-back:hover{background:var(--primary-light);}
.btn-next{background:var(--primary);color:#fff;border:2px solid var(--primary);}
.btn-next:hover{background:var(--primary-mid);}

#confetti-canvas{display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;pointer-events:none;z-index:9999;}
</style>
</head>
<body>
<div class="g-container">

<header class="page-header">
  <div class="unit-code">IN05 ｜ 江原予備校オリジナル問題（対面指導生徒・限定配信）</div>
  <h1>不等式の文章題①（合計購入型）｜確認テスト</h1>
</header>

<nav class="step-nav">
  <div class="step-item"><a href="intro.html"><span class="step-circle">1</span>導入</a></div>
  <span class="step-arrow">→</span>
  <div class="step-item"><a href="example.html"><span class="step-circle">2</span>例題</a></div>
  <span class="step-arrow">→</span>
  <div class="step-item"><a href="drill.html"><span class="step-circle">3</span>演習</a></div>
  <span class="step-arrow">→</span>
  <div class="step-item active"><span class="step-circle">4</span>確認</div>
</nav>

<div class="content">

  <div class="intro-lead">
    📝 合計購入型の2パターンが本当に身についたかチェック！全問正解でクリアです🎉<br>
    <strong>以内型・以上型</strong>がまんべんなく出題されます。
  </div>

  <div id="quizArea"></div>

  <div id="scoreBox" class="score-box">
    <div class="score-num"><span id="scoreText"></span></div>
    <div class="msg" id="scoreMsg"></div>
    <button class="retry-btn" onclick="retry()">🔄 もう一度挑戦</button>
  </div>

  <div class="btn-row">
    <a href="drill.html" class="btn-back">← 演習へ戻る</a>
    <a href="../gamba_kounin.html" class="btn-next">単元一覧へ →</a>
  </div>

</div>
</div>

<canvas id="confetti-canvas"></canvas>

<script>
/* ─────────── 解説生成ヘルパー ─────────── */

function buildUpperSolution(p){
  return `
    <div class="sol-title">📖 以内型の解き方</div>
    <div class="sol-step">
      <span class="sol-num">①</span>
      <div class="sol-body">${p.askName}を $x$ ${p.unit}とおく。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">②</span>
      <div class="sol-body">もう一方は $(${p.total}-x)$ ${p.unit}。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">③</span>
      <div class="sol-body">合計代金：${p.expr}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">④</span>
      <div class="sol-body">予算以内：${p.equation}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">⑤</span>
      <div class="sol-body">
        <div class="calc-line"><span class="op-label">かっこを外す：</span>${p.expand}</div>
        <div class="calc-line"><span class="op-label">整理：</span>${p.simplify}</div>
        <div class="calc-line"><span class="op-label">解く：</span>${p.final}</div>
        <div class="int-note">✅ 整数なので最大 ${p.answer}${p.unit}${p.cutoffNote ? '（小数点以下は切り捨て）' : ''}</div>
      </div>
    </div>
  `;
}

function buildLowerSolution(p){
  return `
    <div class="sol-title">📖 以上型の解き方</div>
    <div class="sol-step">
      <span class="sol-num">①</span>
      <div class="sol-body">${p.askName}を $x$ ${p.unit}とおく。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">②</span>
      <div class="sol-body">もう一方は $(${p.total}-x)$ ${p.unit}。</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">③</span>
      <div class="sol-body">合計代金：${p.expr}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">④</span>
      <div class="sol-body">${p.condName}以上：${p.equation}</div>
    </div>
    <div class="sol-step">
      <span class="sol-num">⑤</span>
      <div class="sol-body">
        <div class="calc-line"><span class="op-label">かっこを外す：</span>${p.expand}</div>
        <div class="calc-line"><span class="op-label">整理：</span>${p.simplify}</div>
        <div class="calc-line"><span class="op-label">解く：</span>${p.final}</div>
        <div class="int-note">✅ 整数なので ${p.answer}${p.unit}以上${p.cutoffNote ? '（小数点以下を切り上げ）' : ''}</div>
      </div>
    </div>
  `;
}

/* ─────────── 確認テスト 5問 ─────────── */
const QS = [
  /* Q1: チョコレート・グミ（以内型） */
  {
    pattern:'以内型',
    text:'チョコレートとグミを合わせて<span class="kw-num">18個</span>買う。チョコレート1個<span class="kw-num">90円</span>，グミ1個<span class="kw-num">60円</span>のとき，代金の合計を<span class="kw-num">1400円</span><span class="kw-cond">以内</span>にするには，チョコレートを最大何個まで買えるか。',
    choices:['9個','10個','11個','12個'],
    ans:1,
    solution: buildUpperSolution({
      askName:'チョコレートの個数', unit:'個', total:'18',
      expr:'$90x + 60(18-x)$（円）',
      equation:'$90x + 60(18-x) \\leqq 1400$',
      expand:'$90x + 1080 - 60x \\leqq 1400$',
      simplify:'$30x + 1080 \\leqq 1400$',
      final:'$x \\leqq 10.67\\cdots$',
      answer:'10',
      cutoffNote:true
    })
  },
  /* Q2: コンパス・定規（以上型） */
  {
    pattern:'以上型',
    text:'コンパスと定規を合わせて<span class="kw-num">9個</span>買う。コンパス1個<span class="kw-num">250円</span>，定規1個<span class="kw-num">80円</span>のとき，代金の合計を<span class="kw-num">1600円</span><span class="kw-cond">以上</span>にするには，コンパスを何個以上買えばよいか。',
    choices:['4個','5個','6個','7個'],
    ans:2,
    solution: buildLowerSolution({
      askName:'コンパスの個数', unit:'個', total:'9', condName:'1600円',
      expr:'$250x + 80(9-x)$（円）',
      equation:'$250x + 80(9-x) \\geqq 1600$',
      expand:'$250x + 720 - 80x \\geqq 1600$',
      simplify:'$170x + 720 \\geqq 1600$',
      final:'$x \\geqq 5.18\\cdots$',
      answer:'6',
      cutoffNote:true
    })
  },
  /* Q3: 折り紙セットB・A（以内型） */
  {
    pattern:'以内型',
    text:'折り紙セットAとセットBを合わせて<span class="kw-num">8セット</span>買う。セットA1つ<span class="kw-num">200円</span>，セットB1つ<span class="kw-num">350円</span>のとき，代金の合計を<span class="kw-num">2200円</span><span class="kw-cond">以内</span>にするには，セットBを最大何セットまで買えるか。',
    choices:['3セット','4セット','5セット','6セット'],
    ans:1,
    solution: buildUpperSolution({
      askName:'セットBの数', unit:'セット', total:'8',
      expr:'$350x + 200(8-x)$（円）',
      equation:'$350x + 200(8-x) \\leqq 2200$',
      expand:'$350x + 1600 - 200x \\leqq 2200$',
      simplify:'$150x + 1600 \\leqq 2200$',
      final:'$x \\leqq 4$',
      answer:'4'
    })
  },
  /* Q4: キーホルダー・缶バッジ（以上型） */
  {
    pattern:'以上型',
    text:'キーホルダーと缶バッジを合わせて<span class="kw-num">10個</span>買う。キーホルダー1個<span class="kw-num">280円</span>，缶バッジ1個<span class="kw-num">120円</span>のとき，代金の合計を<span class="kw-num">1800円</span><span class="kw-cond">以上</span>にするには，キーホルダーを何個以上買えばよいか。',
    choices:['2個','3個','4個','5個'],
    ans:2,
    solution: buildLowerSolution({
      askName:'キーホルダーの個数', unit:'個', total:'10', condName:'1800円',
      expr:'$280x + 120(10-x)$（円）',
      equation:'$280x + 120(10-x) \\geqq 1800$',
      expand:'$280x + 1200 - 120x \\geqq 1800$',
      simplify:'$160x + 1200 \\geqq 1800$',
      final:'$x \\geqq 3.75$',
      answer:'4',
      cutoffNote:true
    })
  },
  /* Q5: シャープペン・ボールペン（以内型） */
  {
    pattern:'以内型',
    text:'シャープペンとボールペンを合わせて<span class="kw-num">13本</span>買う。シャープペン1本<span class="kw-num">220円</span>，ボールペン1本<span class="kw-num">140円</span>のとき，代金の合計を<span class="kw-num">2400円</span><span class="kw-cond">以内</span>にするには，シャープペンを最大何本まで買えるか。',
    choices:['6本','7本','8本','9本'],
    ans:1,
    solution: buildUpperSolution({
      askName:'シャープペンの本数', unit:'本', total:'13',
      expr:'$220x + 140(13-x)$（円）',
      equation:'$220x + 140(13-x) \\leqq 2400$',
      expand:'$220x + 1820 - 140x \\leqq 2400$',
      simplify:'$80x + 1820 \\leqq 2400$',
      final:'$x \\leqq 7.25$',
      answer:'7',
      cutoffNote:true
    })
  }
];

let answered = new Array(QS.length).fill(false);
let answers = new Array(QS.length).fill(null);

function buildQuiz(){
  let html = '';
  QS.forEach((q, i) => {
    html += `
      <div class="qcard">
        <div class="qcard-head">
          <span class="qcard-num">${i+1}</span>
          <span class="qcard-pattern">${q.pattern}</span>
        </div>
        <div class="q-statement">${q.text}</div>
        <div class="choices" id="choices${i}">
          ${q.choices.map((c, j) =>
            `<button class="choice-btn" onclick="selectChoice(${i},${j})">${j+1}）${c}</button>`
          ).join('')}
        </div>
        <div class="result-panel" id="rp${i}"></div>
      </div>
    `;
  });
  document.getElementById('quizArea').innerHTML = html;

  if(window._katexReady){
    renderArea();
  }else{
    window._onKatexReady = renderArea;
  }
}

function renderArea(){
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(document.getElementById('quizArea'), {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

function selectChoice(qi, ci){
  if(answered[qi]) return;
  answered[qi] = true;
  answers[qi] = ci;

  const q = QS[qi];
  const correct = (ci === q.ans);
  const buttons = document.querySelectorAll(`#choices${qi} .choice-btn`);
  buttons.forEach((b, j) => {
    b.disabled = true;
    if(j === q.ans) b.classList.add('correct');
    else if(j === ci) b.classList.add('wrong');
  });

  const rp = document.getElementById('rp'+qi);
  rp.style.display = 'block';
  rp.className = 'result-panel ' + (correct ? 'ok' : 'ng');
  rp.innerHTML =
    `<div class="verdict">${correct ? '✅ 正解！' : `❌ 不正解…　正解は【${q.ans+1}）${q.choices[q.ans]}】`}</div>`
    + q.solution;

  if(typeof renderMathInElement === 'function'){
    renderMathInElement(rp, {
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }

  if(answered.every(v => v)) showScore();
}

function showScore(){
  const correct = answers.filter((a, i) => a === QS[i].ans).length;
  const box = document.getElementById('scoreBox');
  box.classList.add('show');
  document.getElementById('scoreText').textContent = `${correct} / ${QS.length} 問正解`;

  const msgs = [
    'もう一度復習してから再挑戦💪',
    '惜しい！立式を見直そう📖',
    'いい線！もう一歩で合格！✨',
    'すごい！あと1問！🔥',
    'おしい！満点まであと1問！🌟',
    '🎉 満点！IN05 合格おめでとう！合計購入型はバッチリです！'
  ];
  document.getElementById('scoreMsg').textContent = msgs[Math.min(correct, 5)];

  if(correct === QS.length){
    if(typeof markPassed === 'function'){
      try{ markPassed('kouninmath_in05'); }catch(e){}
    }
    launchConfetti();
  }
}

function retry(){
  answered = new Array(QS.length).fill(false);
  answers = new Array(QS.length).fill(null);
  document.getElementById('scoreBox').classList.remove('show');
  buildQuiz();
}

function launchConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');
  canvas.style.display = 'block';
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const colors = ['#1d4ed8','#3b82f6','#f59e0b','#16a34a','#e8372d','#9333ea','#06b6d4'];
  const particles = [];
  for(let i = 0; i < 180; i++){
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      size: Math.random() * 8 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      speed: Math.random() * 3 + 2,
      angle: Math.random() * Math.PI * 2,
      spin: (Math.random() - 0.5) * 0.2
    });
  }

  let frames = 0;
  function update(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => {
      p.y += p.speed;
      p.x += Math.sin(p.angle) * 1.5;
      p.angle += p.spin;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
      if(p.y > canvas.height) p.y = -20;
    });
    frames++;
    if(frames < 400){
      requestAnimationFrame(update);
    }else{
      canvas.style.display = 'none';
    }
  }
  update();
}

window.addEventListener('load', () => {
  buildQuiz();
});
</script>
</body>
</html>
