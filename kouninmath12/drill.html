<style>
:root{--primary:#0f766e;--primary-light:#ccfbf1;--accent:#e8372d;--accent-light:#fff1f0;--success:#16a34a;--success-light:#dcfce7;--warn:#d97706;--warn-light:#fffbeb;--bg:#f0fdfa;--card:#ffffff;--border:#99f6e4;--text:#1e293b;--text-sub:#64748b;--radius:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
.g-container{max-width:760px;margin:0 auto;padding:22px 15px 60px;}
.page-header{background:var(--primary);color:#fff;padding:16px 20px 12px;text-align:center;box-shadow:0 3px 10px rgba(15,118,110,.25);}
.page-header .unit-code{font-size:.8em;opacity:.8;letter-spacing:.1em;margin-bottom:3px;}
.page-header h1{font-size:clamp(.98em,3vw,1.38em);font-weight:700;margin:0;line-height:1.4;}
.step-nav{display:flex;align-items:center;justify-content:center;padding:9px 6px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:10;gap:1px;}
.step-item{display:flex;align-items:center;gap:3px;font-size:clamp(.62em,1.6vw,.78em);color:#94a3b8;white-space:nowrap;padding:2px 4px;}
.step-item a{color:inherit;text-decoration:none;}
.step-item a:hover{color:var(--primary);}
.step-item.active{color:var(--primary);font-weight:700;}
.step-circle{width:19px;height:19px;border-radius:50%;font-size:.68em;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-item.active .step-circle{background:var(--primary);color:#fff;box-shadow:0 0 0 2px var(--primary-light);}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:.9em;padding:0;}
.instruction{background:var(--primary-light);border-left:4px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;padding:12px 15px;margin-bottom:18px;font-size:.93em;color:var(--primary);line-height:1.7;}
.tip2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.tip2 div{border-radius:8px;padding:8px;font-size:.84em;font-weight:700;text-align:center;line-height:1.5;}
.set-badge{background:var(--warn-light);border:1.5px solid var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:.85em;font-weight:700;color:#92400e;text-align:center;}
.problem-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
.problem-head{display:flex;align-items:center;padding:13px 15px;gap:11px;flex-wrap:wrap;font-weight:700;font-size:1em;}
.p-badge{background:var(--primary);color:#fff;font-size:.72em;font-weight:700;border-radius:6px;padding:3px 9px;white-space:nowrap;flex-shrink:0;}
.p-text{flex:1;min-width:0;font-size:1.02em;}
.ans-toggle{margin-left:auto;background:none;border:1.5px solid #94a3b8;border-radius:20px;padding:5px 13px;font-family:'BIZ UDPGothic',sans-serif;font-size:.78em;color:var(--text-sub);cursor:pointer;white-space:nowrap;}
.ans-toggle:hover{border-color:var(--primary);color:var(--primary);}
.ans-area{display:none;padding:0 13px 12px;}
.ans-result{background:var(--primary-light);border:2px solid var(--primary);border-radius:8px;padding:9px 13px;margin-bottom:7px;font-weight:700;color:var(--primary);font-size:1.02em;}
.calc-row{display:flex;align-items:flex-start;gap:6px;padding:8px 11px;border-radius:8px;margin-bottom:5px;font-size:.86em;font-weight:700;line-height:2;}
.calc-row.y{background:var(--warn-light);border:1.5px solid var(--warn);}
.calc-row.g{background:var(--success-light);border:1.5px solid var(--success);}
.clbl{font-size:.68em;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:3px;}
.clbl.y{background:var(--warn);color:#fff;}
.clbl.g{background:var(--success);color:#fff;}
.tasuki-svg{display:block;margin:8px auto;max-width:100%;height:auto;}
.retry-bar{text-align:center;margin:22px 0 10px;}
.btn-retry-set{background:var(--card);border:1.5px solid var(--primary);color:var(--primary);border-radius:50px;padding:8px 20px;font-family:'BIZ UDPGothic',sans-serif;font-size:.88em;font-weight:700;cursor:pointer;}
.btn-retry-set:hover{background:var(--primary-light);}
.nav-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px;}
.btn-nav{font-family:'BIZ UDPGothic','BIZ UDP Gothic',sans-serif;font-size:.93em;font-weight:700;padding:11px 24px;border-radius:50px;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-f{background:var(--primary);color:#fff;}
.btn-b{background:#f1f5f9;color:var(--text-sub);}
.btn-h{background:var(--primary-light);color:var(--primary);font-size:.83em;padding:9px 18px;}
</style>

<body>

<script>
// 橋渡しSVG生成（たすき掛け→因数分解の対応を視覚化）
function bridgeSVG(a1, a2, c1, c2){
  // c1, c2 は "+3", "-7" などの符号付き文字列
  function parseSig(s){
    s = String(s).trim();
    if(s.charAt(0)==='+') return ['+', s.slice(1)];
    if(s.charAt(0)==='-') return ['-', s.slice(1)];
    return ['+', s];
  }
  var p1 = parseSig(c1), p2 = parseSig(c2);
  var s_c1 = p1[0], v_c1 = p1[1];
  var s_c2 = p2[0], v_c2 = p2[1];
  return '<div style="background:#fff;border:2px solid var(--primary);border-radius:12px;padding:14px 14px 10px;margin:14px 0;">'
    +'<div style="font-size:.85em;font-weight:700;color:var(--primary);margin-bottom:11px;text-align:center;">🔑 「✓」が出たあと，どうやって答えの形に？</div>'
    +'<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;max-width:100%;height:auto;">'
    +'<text x="190" y="20" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">外と外（同じ括弧の両端）</text>'
    +'<path d="M 50 55 Q 190 20 320 55" stroke="#dc2626" stroke-width="2.5" fill="none"/>'
    +'<polygon points="320,55 314,49 314,61" fill="#dc2626"/>'
    +'<text x="20" y="100" font-size="22" font-weight="700" fill="#1e293b">(</text>'
    +'<text x="50" y="100" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle">'+a1+'</text>'
    +'<text x="85" y="100" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+s_c2+'</text>'
    +'<text x="125" y="100" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">'+v_c2+'</text>'
    +'<text x="155" y="100" font-size="22" font-weight="700" fill="#1e293b">)</text>'
    +'<text x="180" y="100" font-size="22" font-weight="700" fill="#1e293b">(</text>'
    +'<text x="220" y="100" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">'+a2+'</text>'
    +'<text x="260" y="100" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+s_c1+'</text>'
    +'<text x="295" y="100" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle">'+v_c1+'</text>'
    +'<text x="320" y="100" font-size="22" font-weight="700" fill="#1e293b">)</text>'
    +'<path d="M 125 115 Q 190 165 220 115" stroke="#2563eb" stroke-width="2.5" fill="none"/>'
    +'<polygon points="220,115 215,121 226,120" fill="#2563eb"/>'
    +'<text x="190" y="190" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">内と内（隣り合う中身）</text>'
    +'</svg>'
    +'<div style="background:#fef9c3;border:1.5px dashed #eab308;border-radius:8px;padding:9px 12px;margin-top:11px;font-size:.86em;line-height:1.9;color:#713f12;font-weight:700;">'
    +'<strong>📌 「外と外」「内と内」の置き方：</strong><br>'
    +'・<span style="color:#dc2626;">赤の弧（外と外）</span>：'+a1+' と '+s_c2+v_c2+' を <strong>同じ括弧の両端</strong> に置く<br>'
    +'・<span style="color:#2563eb;">青の弧（内と内）</span>：'+s_c1+v_c1+' と '+a2+' を <strong>隣り合う内側</strong> に置く<br>'
    +'こうして $('+a1+s_c2+v_c2+')('+a2+s_c1+v_c1+')$ になる！'
    +'</div>'
    +'<div style="background:#dcfce7;border:1.5px solid #16a34a;border-radius:8px;padding:9px 12px;margin-top:8px;font-size:.86em;line-height:1.9;color:#15803d;font-weight:700;">'
    +'💡 これは <strong>EF10 の「外×外＋内×内」の逆操作</strong>！　展開で学んだ仕組みを <strong>巻き戻している</strong> だけ。'
    +'</div>'
    +'</div>';
}

function tasuki(a1, a2, c1, c2, r1, r2, total){
  var sv = '<svg class="tasuki-svg" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg">'
    +'<text x="40" y="40" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+a1+'</text>'
    +'<text x="40" y="95" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+a2+'</text>'
    +'<text x="180" y="40" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+c1+'</text>'
    +'<text x="180" y="95" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+c2+'</text>'
    +'<line x1="60" y1="35" x2="160" y2="92" stroke="#dc2626" stroke-width="2"/>'
    +'<line x1="60" y1="92" x2="160" y2="35" stroke="#2563eb" stroke-width="2"/>'
    +'<text x="265" y="40" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">…'+r1+'</text>'
    +'<text x="265" y="95" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">…'+r2+'</text>'
    +'<line x1="240" y1="105" x2="320" y2="105" stroke="#94a3b8" stroke-width="1"/>'
    +'<text x="290" y="125" font-size="16" font-weight="700" fill="#16a34a" text-anchor="middle">'+total+' ✓</text>'
    +'</svg>';
  return sv + bridgeSVG(a1, a2, c1, c2);
}

const SETS=[
  {
    set_id:1,
    label:"セット1：基本（係数が小さい）",
    problems:[
      {q:"$6x^2-7x+2$ を因数分解",ans:"$(3x-2)(2x-1)$",hint:"$6=3 \\times 2$, $2=2 \\times 1$（両マイナス）"+tasuki("3x","2x","-2","-1","-3x","-4x","-7x")},
      {q:"$6x^2-13x+5$ を因数分解",ans:"$(3x-5)(2x-1)$",hint:"$6=3 \\times 2$, $5=5 \\times 1$"+tasuki("3x","2x","-5","-1","-3x","-10x","-13x")},
      {q:"$5x^2-36x+7$ を因数分解",ans:"$(5x-1)(x-7)$",hint:"$5=5 \\times 1$, $7=1 \\times 7$"+tasuki("5x","1x","-1","-7","-35x","-1x","-36x")},
      {q:"$5x^2-38x+21$ を因数分解",ans:"$(5x-3)(x-7)$",hint:"$5=5 \\times 1$, $21=3 \\times 7$"+tasuki("5x","1x","-3","-7","-35x","-3x","-38x")},
    ]
  },
  {
    set_id:2,
    label:"セット2：標準（高認頻出）",
    problems:[
      {q:"$6x^2-23x+21$ を因数分解",ans:"$(3x-7)(2x-3)$",hint:"$6=3 \\times 2$, $21=7 \\times 3$"+tasuki("3x","2x","-7","-3","-9x","-14x","-23x")},
      {q:"$6x^2-23x+20$ を因数分解",ans:"$(3x-4)(2x-5)$",hint:"$6=3 \\times 2$, $20=4 \\times 5$"+tasuki("3x","2x","-4","-5","-15x","-8x","-23x")},
      {q:"$6x^2-23x+7$ を因数分解",ans:"$(3x-1)(2x-7)$",hint:"$6=3 \\times 2$, $7=1 \\times 7$"+tasuki("3x","2x","-1","-7","-21x","-2x","-23x")},
      {q:"$10x^2-17x+3$ を因数分解",ans:"$(5x-1)(2x-3)$",hint:"$10=5 \\times 2$, $3=1 \\times 3$"+tasuki("5x","2x","-1","-3","-15x","-2x","-17x")},
    ]
  },
  {
    set_id:3,
    label:"セット3：少し大きい数",
    problems:[
      {q:"$15x^2-31x+10$ を因数分解",ans:"$(5x-2)(3x-5)$",hint:"$15=5 \\times 3$, $10=2 \\times 5$"+tasuki("5x","3x","-2","-5","-25x","-6x","-31x")},
      {q:"$14x^2-25x+6$ を因数分解",ans:"$(7x-2)(2x-3)$",hint:"$14=7 \\times 2$, $6=2 \\times 3$"+tasuki("7x","2x","-2","-3","-21x","-4x","-25x")},
      {q:"$8x^2-26x+15$ を因数分解",ans:"$(4x-3)(2x-5)$",hint:"$8=4 \\times 2$, $15=3 \\times 5$"+tasuki("4x","2x","-3","-5","-20x","-6x","-26x")},
      {q:"$12x^2-25x+12$ を因数分解",ans:"$(3x-4)(4x-3)$",hint:"$12=3 \\times 4$, $12=4 \\times 3$"+tasuki("3x","4x","-4","-3","-9x","-16x","-25x")},
    ]
  },
  {
    set_id:4,
    label:"セット4：応用",
    problems:[
      {q:"$4x^2-13x+10$ を因数分解",ans:"$(4x-5)(x-2)$",hint:"$4=4 \\times 1$, $10=5 \\times 2$"+tasuki("4x","1x","-5","-2","-8x","-5x","-13x")},
      {q:"$9x^2-12x+4$ を因数分解",ans:"$(3x-2)^2$",hint:"$9=3 \\times 3$, $4=2 \\times 2$ → 完全平方"+tasuki("3x","3x","-2","-2","-6x","-6x","-12x")},
      {q:"$2x^2-9x+10$ を因数分解",ans:"$(2x-5)(x-2)$",hint:"$2=2 \\times 1$, $10=5 \\times 2$"+tasuki("2x","1x","-5","-2","-4x","-5x","-9x")},
      {q:"$3x^2-10x+8$ を因数分解",ans:"$(3x-4)(x-2)$",hint:"$3=3 \\times 1$, $8=4 \\times 2$"+tasuki("3x","1x","-4","-2","-6x","-4x","-10x")},
    ]
  },
];

let currentSet=null;

function pickSet(){
  const idx=Math.floor(Math.random()*SETS.length);
  currentSet=SETS[idx];
}

function build(){
  document.getElementById('set-label').textContent='📚 '+currentSet.label;
  const area=document.getElementById('drill-area');
  area.innerHTML='';
  currentSet.problems.forEach((p,i)=>{
    const card=document.createElement('div');
    card.className='problem-card';
    card.id='dc'+i;
    card.innerHTML='<div class="problem-head">'
      +'<span class="p-badge">問'+(i+1)+'</span>'
      +'<span class="p-text">'+p.q+'</span>'
      +'<button class="ans-toggle" onclick="togDrill('+i+')">答を見る</button>'
      +'</div>'
      +'<div class="ans-area" id="da'+i+'"></div>';
    area.appendChild(card);
  });
  renderAllMath();
}

function togDrill(i){
  const p=currentSet.problems[i];
  const d=document.getElementById('da'+i);
  const btn=document.querySelector('#dc'+i+' .ans-toggle');
  if(d.style.display==='block'){
    d.style.display='none';
    btn.textContent='答を見る';
    return;
  }
  d.innerHTML='<div class="ans-result">正解：'+p.ans+'</div>'
    +'<div class="calc-row y"><span class="clbl y">考え方</span><div>'+p.hint+'</div></div>'
    +'<div class="calc-row g"><span class="clbl g">答え</span><div>'+p.ans+'</div></div>';
  d.style.display='block';
  btn.textContent='答を隠す';
  if(typeof renderMathInElement==='function'){
    renderMathInElement(d,{
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}

function reloadSet(){
  const prev=currentSet;
  do{
    pickSet();
  }while(SETS.length>1 && currentSet===prev);
  build();
}

function renderAllMath(){
  if(typeof renderMathInElement==='function'){
    renderMathInElement(document.body,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

pickSet();
build();
</script>
<script src="../gamba_support.js"></script>
</body>
