<style>
:root{--primary:#0f766e;--primary-light:#ccfbf1;--accent:#e8372d;--accent-light:#fff1f0;--success:#16a34a;--success-light:#dcfce7;--warn:#d97706;--warn-light:#fffbeb;--bg:#f0fdfa;--card:#ffffff;--border:#99f6e4;--text:#1e293b;--text-sub:#64748b;--radius:12px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;}
.g-container{max-width:760px;margin:0 auto;padding:22px 15px 60px;}
.page-header{background:var(--primary);color:#fff;padding:16px 20px 12px;text-align:center;box-shadow:0 3px 10px rgba(15,118,110,.25);}
.page-header .unit-code{font-size:.8em;opacity:.8;letter-spacing:.1em;margin-bottom:3px;}
.page-header h1{font-size:clamp(.98em,3vw,1.38em);font-weight:700;margin:0;line-height:1.4;}
.step-nav{display:flex;align-items:center;justify-content:center;padding:9px 6px;background:var(--card);border-bottom:1px solid var(--border);flex-wrap:nowrap;overflow-x:auto;position:sticky;top:0;z-index:10;gap:1px;}
.step-item{display:flex;align-items:center;gap:3px;font-size:clamp(.62em,1.6vw,.78em);color:#94a3b8;white-space:nowrap;padding:2px 4px;}
.step-item a{color:inherit;text-decoration:none;}
.step-item a:hover{color:var(--primary);}
.step-item.active{color:var(--primary);font-weight:700;}
.step-circle{width:19px;height:19px;border-radius:50%;font-size:.68em;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-item.active .step-circle{background:var(--primary);color:#fff;box-shadow:0 0 0 2px var(--primary-light);}
.step-item:not(.active) .step-circle{background:#94a3b8;color:#fff;}
.step-arrow{color:#cbd5e1;font-size:.9em;padding:0;}
.instruction{background:var(--primary-light);border-left:4px solid var(--primary);border-radius:0 var(--radius) var(--radius) 0;padding:12px 15px;margin-bottom:18px;font-size:.93em;color:var(--primary);line-height:1.7;}
.tip2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.tip2 div{border-radius:8px;padding:8px;font-size:.84em;font-weight:700;text-align:center;line-height:1.5;}
.ex-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:16px;overflow:hidden;}
.ex-head{padding:10px 15px;font-size:.86em;font-weight:700;display:flex;align-items:center;gap:8px;background:var(--primary);color:#fff;}
.ex-num{background:rgba(255,255,255,.25);border-radius:50%;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.78em;flex-shrink:0;}
.ex-body{padding:14px 16px 8px;}
.q-text{font-size:1.1em;font-weight:700;margin-bottom:12px;color:var(--primary);line-height:2;}
.sr{display:flex;align-items:flex-start;gap:9px;padding:9px 12px;border-radius:8px;margin-bottom:7px;font-size:.88em;font-weight:700;line-height:2.1;animation:fadeIn .3s ease;}
.sr.y{background:var(--warn-light);border:1.5px solid var(--warn);}
.sr.b{background:var(--primary-light);border:1.5px solid var(--primary);}
.sr.r{background:var(--accent-light);border:1.5px solid var(--accent);}
.sr.g{background:var(--success-light);border:1.5px solid var(--success);}
.sl{font-size:.68em;font-weight:700;border-radius:5px;padding:2px 7px;white-space:nowrap;flex-shrink:0;margin-top:4px;}
.sl.y{background:var(--warn);color:#fff;}
.sl.b{background:var(--primary);color:#fff;}
.sl.r{background:var(--accent);color:#fff;}
.sl.g{background:var(--success);color:#fff;}
.ans-box{background:var(--primary-light);border:2px solid var(--primary);border-radius:9px;padding:10px 14px;margin-bottom:8px;font-size:1.1em;font-weight:700;color:var(--primary);text-align:center;line-height:2.2;animation:fadeIn .3s ease;}
.next-btn{width:100%;background:var(--primary);color:#fff;border:none;border-radius:8px;padding:11px;font-family:'BIZ UDPGothic',sans-serif;font-size:.93em;font-weight:700;cursor:pointer;margin-bottom:11px;transition:background .15s;}
.next-btn:hover{background:#0d6661;}
.done-badge{text-align:center;padding:6px;font-size:.84em;font-weight:700;color:var(--success);margin-bottom:10px;}
.tasuki-svg{display:block;margin:8px auto;max-width:100%;height:auto;}
.nav-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:26px;}
.btn-nav{font-family:'BIZ UDPGothic','BIZ UDP Gothic',sans-serif;font-size:.93em;font-weight:700;padding:11px 24px;border-radius:50px;border:none;cursor:pointer;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s;}
.btn-nav:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.15);}
.btn-f{background:var(--primary);color:#fff;}
.btn-b{background:#f1f5f9;color:var(--text-sub);}
.btn-h{background:var(--primary-light);color:var(--primary);font-size:.83em;padding:9px 18px;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="page-header">
  <div class="unit-code">EF12</div>
  <h1>因数分解 たすき掛け（両マイナス）<br><small style="font-size:.75em;opacity:.85;">例題</small></h1>
</div>
<nav class="step-nav">

  <span class="step-arrow">›</span>

</nav>
<main class="g-container">
<div class="instruction"><strong>【例題】</strong>　ボタンをタップして両マイナス型の手順をマスターしよう！</div>
<div class="tip2">
  <div style="background:var(--primary-light);color:var(--primary);">①符号確認<br>②たすき掛け（両マイナス）</div>
  <div style="background:var(--accent-light);color:var(--accent);">数字すべて<br>マイナス！</div>
</div>

<div class="nav-btns">

</div>
</main>

<script>
// 橋渡しSVG生成（たすき掛け→因数分解の対応を視覚化）
function bridgeSVG(a1, a2, c1, c2){
  // c1, c2 は "+3", "-7" などの符号付き文字列
  function parseSig(s){
    s = String(s).trim();
    if(s.charAt(0)==='+') return ['+', s.slice(1)];
    if(s.charAt(0)==='-') return ['-', s.slice(1)];
    return ['+', s];
  }
  var p1 = parseSig(c1), p2 = parseSig(c2);
  var s_c1 = p1[0], v_c1 = p1[1];
  var s_c2 = p2[0], v_c2 = p2[1];
  return '<div style="background:#fff;border:2px solid var(--primary);border-radius:12px;padding:14px 14px 10px;margin:14px 0;">'
    +'<div style="font-size:.85em;font-weight:700;color:var(--primary);margin-bottom:11px;text-align:center;">🔑 「✓」が出たあと，どうやって答えの形に？</div>'
    +'<svg viewBox="0 0 380 200" xmlns="http://www.w3.org/2000/svg" style="display:block;margin:0 auto;max-width:100%;height:auto;">'
    +'<text x="190" y="20" font-size="13" font-weight="700" fill="#dc2626" text-anchor="middle">外と外（同じ括弧の両端）</text>'
    +'<path d="M 50 55 Q 190 20 320 55" stroke="#dc2626" stroke-width="2.5" fill="none"/>'
    +'<polygon points="320,55 314,49 314,61" fill="#dc2626"/>'
    +'<text x="20" y="100" font-size="22" font-weight="700" fill="#1e293b">(</text>'
    +'<text x="50" y="100" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle">'+a1+'</text>'
    +'<text x="85" y="100" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+s_c2+'</text>'
    +'<text x="125" y="100" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">'+v_c2+'</text>'
    +'<text x="155" y="100" font-size="22" font-weight="700" fill="#1e293b">)</text>'
    +'<text x="180" y="100" font-size="22" font-weight="700" fill="#1e293b">(</text>'
    +'<text x="220" y="100" font-size="22" font-weight="700" fill="#2563eb" text-anchor="middle">'+a2+'</text>'
    +'<text x="260" y="100" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+s_c1+'</text>'
    +'<text x="295" y="100" font-size="22" font-weight="700" fill="#dc2626" text-anchor="middle">'+v_c1+'</text>'
    +'<text x="320" y="100" font-size="22" font-weight="700" fill="#1e293b">)</text>'
    +'<path d="M 125 115 Q 190 165 220 115" stroke="#2563eb" stroke-width="2.5" fill="none"/>'
    +'<polygon points="220,115 215,121 226,120" fill="#2563eb"/>'
    +'<text x="190" y="190" font-size="13" font-weight="700" fill="#2563eb" text-anchor="middle">内と内（隣り合う中身）</text>'
    +'</svg>'
    +'<div style="background:#fef9c3;border:1.5px dashed #eab308;border-radius:8px;padding:9px 12px;margin-top:11px;font-size:.86em;line-height:1.9;color:#713f12;font-weight:700;">'
    +'<strong>📌 「外と外」「内と内」の置き方：</strong><br>'
    +'・<span style="color:#dc2626;">赤の弧（外と外）</span>：'+a1+' と '+s_c2+v_c2+' を <strong>同じ括弧の両端</strong> に置く<br>'
    +'・<span style="color:#2563eb;">青の弧（内と内）</span>：'+s_c1+v_c1+' と '+a2+' を <strong>隣り合う内側</strong> に置く<br>'
    +'こうして $('+a1+s_c2+v_c2+')('+a2+s_c1+v_c1+')$ になる！'
    +'</div>'
    +'<div style="background:#dcfce7;border:1.5px solid #16a34a;border-radius:8px;padding:9px 12px;margin-top:8px;font-size:.86em;line-height:1.9;color:#15803d;font-weight:700;">'
    +'💡 これは <strong>EF10 の「外×外＋内×内」の逆操作</strong>！　展開で学んだ仕組みを <strong>巻き戻している</strong> だけ。'
    +'</div>'
    +'</div>';
}

function tasukiSVG(a1, a2, c1, c2, r1, r2, total, ok){
  const color = ok ? '#16a34a' : '#dc2626';
  const mark = ok ? '✓' : '✗';
  var sv = '<svg class="tasuki-svg" viewBox="0 0 320 130" xmlns="http://www.w3.org/2000/svg">'
    +'<text x="40" y="40" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+a1+'</text>'
    +'<text x="40" y="95" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+a2+'</text>'
    +'<text x="180" y="40" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+c1+'</text>'
    +'<text x="180" y="95" font-size="20" font-weight="700" fill="#1e293b" text-anchor="middle">'+c2+'</text>'
    +'<line x1="60" y1="35" x2="160" y2="92" stroke="#dc2626" stroke-width="2"/>'
    +'<line x1="60" y1="92" x2="160" y2="35" stroke="#2563eb" stroke-width="2"/>'
    +'<text x="265" y="40" font-size="16" font-weight="700" fill="#dc2626" text-anchor="start">…'+r1+'</text>'
    +'<text x="265" y="95" font-size="16" font-weight="700" fill="#2563eb" text-anchor="start">…'+r2+'</text>'
    +'<line x1="240" y1="105" x2="320" y2="105" stroke="#94a3b8" stroke-width="1"/>'
    +'<text x="290" y="125" font-size="16" font-weight="700" fill="'+color+'" text-anchor="middle">'+total+' '+mark+'</text>'
    +'</svg>';
  return sv + (ok ? bridgeSVG(a1, a2, c1, c2) : '');
}

const EXAMPLES=[
  {
    title:"基本：$6x^2 - 7x + 2$",
    q:"$6x^2 - 7x + 2$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"定数項 $+2$，係数 $-7$ → <strong>両マイナス</strong>"},
      {cls:"y",lbl:"予想",txt:"$6 = 3 \\times 2$，$2 = 1 \\times 2$"},
      {cls:"r",lbl:"パターン①",txt:"$(6x-1)(x-2)$？"+tasukiSVG("6x","1x","-1","-2","-12x","-1x","-13x",false)+"たすと $-13x$ → 不一致"},
      {cls:"g",lbl:"パターン②",txt:"$(3x-2)(2x-1)$？"+tasukiSVG("3x","2x","-2","-1","-3x","-4x","-7x",true)+"たすと $-7x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$6x^2 - 7x + 2 = (3x-2)(2x-1)$"},
    ],
    ans:"$(3x-2)(2x-1)$"
  },
  {
    title:"$6x^2 - 13x + 5$",
    q:"$6x^2 - 13x + 5$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"定数項 $+5$，係数 $-13$ → <strong>両マイナス</strong>"},
      {cls:"y",lbl:"予想",txt:"$6=3 \\times 2$，$5=1 \\times 5$"},
      {cls:"g",lbl:"$(3x-5)(2x-1)$？",txt:tasukiSVG("3x","2x","-5","-1","-3x","-10x","-13x",true)+"たすと $-13x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$6x^2 - 13x + 5 = (3x-5)(2x-1)$"},
    ],
    ans:"$(3x-5)(2x-1)$"
  },
  {
    title:"$5x^2 - 36x + 7$",
    q:"$5x^2 - 36x + 7$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"定数項 $+7$，係数 $-36$ → <strong>両マイナス</strong>"},
      {cls:"y",lbl:"予想",txt:"$5$ も $7$ も素数 → 分解パターンが少ない"},
      {cls:"g",lbl:"$(5x-1)(x-7)$？",txt:tasukiSVG("5x","1x","-1","-7","-35x","-1x","-36x",true)+"たすと $-36x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$5x^2 - 36x + 7 = (5x-1)(x-7)$"},
      {cls:"g",lbl:"ポイント",txt:"係数が <strong>大きく見えても</strong>，素数なら分解候補は少なくて楽"},
    ],
    ans:"$(5x-1)(x-7)$"
  },
  {
    title:"$6x^2 - 23x + 21$",
    q:"$6x^2 - 23x + 21$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"定数項 $+21$，係数 $-23$ → <strong>両マイナス</strong>"},
      {cls:"y",lbl:"予想",txt:"$6=3 \\times 2$，$21=3 \\times 7$ または $7 \\times 3$"},
      {cls:"g",lbl:"$(3x-7)(2x-3)$？",txt:tasukiSVG("3x","2x","-7","-3","-9x","-14x","-23x",true)+"たすと $-23x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$6x^2 - 23x + 21 = (3x-7)(2x-3)$"},
    ],
    ans:"$(3x-7)(2x-3)$"
  },
  {
    title:"$6x^2 - 23x + 20$",
    q:"$6x^2 - 23x + 20$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"両マイナス"},
      {cls:"y",lbl:"予想",txt:"$6=3 \\times 2$，$20=4 \\times 5$"},
      {cls:"g",lbl:"$(3x-4)(2x-5)$？",txt:tasukiSVG("3x","2x","-4","-5","-15x","-8x","-23x",true)+"たすと $-23x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$6x^2 - 23x + 20 = (3x-4)(2x-5)$"},
    ],
    ans:"$(3x-4)(2x-5)$"
  },
  {
    title:"$15x^2 - 31x + 10$",
    q:"$15x^2 - 31x + 10$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"両マイナス"},
      {cls:"y",lbl:"予想",txt:"$15=5 \\times 3$ または $15 \\times 1$，$10=5 \\times 2$ または $2 \\times 5$"},
      {cls:"g",lbl:"$(5x-2)(3x-5)$？",txt:tasukiSVG("5x","3x","-2","-5","-25x","-6x","-31x",true)+"たすと $-31x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$15x^2 - 31x + 10 = (5x-2)(3x-5)$"},
      {cls:"g",lbl:"ポイント",txt:"両方とも <strong>分解の組み合わせが多い</strong> → 順番に試す"},
    ],
    ans:"$(5x-2)(3x-5)$"
  },
  {
    title:"$8x^2 - 26x + 15$",
    q:"$8x^2 - 26x + 15$ を因数分解する",
    steps:[
      {cls:"y",lbl:"符号",txt:"両マイナス"},
      {cls:"y",lbl:"予想",txt:"$8=4 \\times 2$ または $8 \\times 1$，$15=3 \\times 5$"},
      {cls:"g",lbl:"$(4x-3)(2x-5)$？",txt:tasukiSVG("4x","2x","-3","-5","-20x","-6x","-26x",true)+"たすと $-26x$ → 一致！"},
      {cls:"b",lbl:"答え",txt:"$8x^2 - 26x + 15 = (4x-3)(2x-5)$"},
      {cls:"g",lbl:"ポイント",txt:"高認頻出！　<strong>慣れれば</strong> パッと組み合わせが見える"},
    ],
    ans:"$(4x-3)(2x-5)$"
  },
];

const state=EXAMPLES.map(()=>0);

function buildAll(){
  const area=document.getElementById('ex-area');
  EXAMPLES.forEach((ex,i)=>{
    const div=document.createElement('div');
    div.className='ex-card';div.id='ec'+i;
    div.innerHTML='<div class="ex-head">'
      +'<span class="ex-num">'+(i+1)+'</span>'+ex.title+'</div>'
      +'<div class="ex-body"><div class="q-text">'+ex.q+'</div>'
      +'<div id="steps'+i+'"></div>'
      +'<button class="next-btn" id="btn'+i+'" onclick="nextStep('+i+')">💡 考え方を見る</button>'
      +'<div id="done'+i+'" class="done-badge" style="display:none;">✅ 完了！</div>'
      +'</div>';
    area.appendChild(div);
  });
}

function nextStep(i){
  const ex=EXAMPLES[i],cur=state[i];
  const sd=document.getElementById('steps'+i);
  const btn=document.getElementById('btn'+i);
  const done=document.getElementById('done'+i);
  if(cur<ex.steps.length){
    const s=ex.steps[cur];
    const row=document.createElement('div');
    row.className='sr '+s.cls;
    row.innerHTML='<span class="sl '+s.cls+'">'+s.lbl+'</span><div>'+s.txt+'</div>';
    sd.appendChild(row);
    state[i]++;
    btn.textContent=state[i]<ex.steps.length?'➡ 次のステップへ':'✅ 答えを見る';
    if(typeof renderMathInElement==='function'){
      renderMathInElement(row,{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError:false
      });
    }
  }else{
    const ab=document.createElement('div');
    ab.className='ans-box';
    ab.innerHTML='答え：'+ex.ans;
    sd.appendChild(ab);
    btn.style.display='none';
    done.style.display='block';
    if(typeof renderMathInElement==='function'){
      renderMathInElement(ab,{
        delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
        throwOnError:false
      });
    }
  }
}

function renderAllMath(){
  if(typeof renderMathInElement==='function'){
    renderMathInElement(document.body,{
      delimiters:[
        {left:'$$',right:'$$',display:true},
        {left:'$',right:'$',display:false}
      ],
      throwOnError:false
    });
  }
}

buildAll();
</script>
<script src="../gamba_support.js"></script>
</body>
