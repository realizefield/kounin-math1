<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IN02 不等式の解き方①｜確認テスト</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js" onload="window._katexReady = true; if(window._onKatexReady) window._onKatexReady();"></script>
<script defer src="../gamba_support.js"></script>
<style>
:root{
  --primary:#1d4ed8;
  --primary-light:#dbeafe;
  --primary-pale:#eff6ff;
  --accent:#e8372d;
  --bg:#eff6ff;
  --border:#bfdbfe;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic','BIZ UDP Gothic','Meiryo',sans-serif;background:var(--bg);color:#1f2937;line-height:1.8;padding:20px;max-width:900px;margin:0 auto;}
header{background:var(--primary);color:#fff;padding:20px 24px;border-radius:12px 12px 0 0;margin:-20px -20px 0 -20px;}
h1{font-size:1.4em;margin-bottom:4px;}
.subtitle{font-size:0.95em;opacity:0.9;}
section{background:#fff;padding:24px;border-radius:0 0 12px 12px;border:2px solid var(--border);border-top:none;margin-bottom:20px;}
.intro-msg{background:var(--primary-pale);border-left:4px solid var(--primary);padding:12px 16px;margin-bottom:20px;border-radius:4px;}
.qcard{background:#fff;border:2px solid var(--border);border-radius:8px;padding:18px 20px;margin:16px 0;}
.qheader{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.qnum{background:var(--primary);color:#fff;padding:4px 12px;border-radius:4px;font-weight:bold;font-size:0.9em;}
.qtype{background:var(--primary-light);color:var(--primary);padding:3px 10px;border-radius:4px;font-size:0.85em;font-weight:bold;}
.warn-tag{background:var(--accent);color:#fff;padding:3px 10px;border-radius:4px;font-size:0.85em;font-weight:bold;}
.qbody{background:var(--primary-pale);padding:12px 16px;border-radius:6px;margin:8px 0;font-size:1.05em;text-align:center;}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0;}
@media(max-width:600px){.choices{grid-template-columns:1fr;}}
.choice-btn{background:#fff;border:2px solid var(--border);padding:10px 14px;border-radius:6px;cursor:pointer;font-size:1em;font-family:inherit;text-align:left;transition:0.2s;}
.choice-btn:hover:not(:disabled){background:var(--primary-light);border-color:var(--primary);}
.choice-btn.correct{background:#dcfce7;border-color:#16a34a;color:#15803d;font-weight:bold;}
.choice-btn.wrong{background:#fee2e2;border-color:#dc2626;color:#991b1b;}
.choice-btn:disabled{cursor:default;}
.feedback{margin-top:10px;padding:10px 14px;border-radius:6px;display:none;}
.feedback.show{display:block;}
.feedback.ok{background:#dcfce7;border-left:4px solid #16a34a;color:#15803d;}
.feedback.ng{background:#fee2e2;border-left:4px solid #dc2626;color:#991b1b;}
.result-area{background:linear-gradient(to right,var(--primary-light),var(--primary-pale));border:2px solid var(--primary);padding:20px 24px;border-radius:8px;margin:20px 0;text-align:center;display:none;}
.result-area.show{display:block;}
.result-area h3{color:var(--primary);font-size:1.3em;margin-bottom:8px;}
.score-num{font-size:2em;font-weight:bold;color:var(--accent);margin:10px 0;}
.celebrate{font-size:3em;margin:10px 0;}
.btn-retry{background:var(--primary);color:#fff;border:none;padding:12px 24px;border-radius:6px;cursor:pointer;font-size:1em;font-weight:bold;font-family:inherit;margin-top:12px;}
.btn-retry:hover{background:#1e40af;}
.nav{display:flex;justify-content:space-between;margin-top:24px;gap:12px;}
.nav a{flex:1;padding:14px 20px;background:var(--primary);color:#fff;text-decoration:none;border-radius:8px;text-align:center;font-weight:bold;transition:0.2s;}
.nav a:hover{background:#1e40af;}
.nav a.back{background:#6b7280;}
.nav a.back:hover{background:#4b5563;}
.confetti{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000;display:none;}
.confetti.show{display:block;}
.confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:fall 3s linear forwards;}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);}}
</style>
</head>
<body>

<header>
  <h1>IN02 確認テスト</h1>
  <div class="subtitle">不等式の解き方①（基本パターン）</div>
</header>

<section>

<div class="intro-msg">
  <strong>📝 全5問の確認テストです。</strong><br>
  全問正解で🎉が表示されます。間違えても「もう一度挑戦」で何度でも再チャレンジできます。
</div>

<div id="quizArea"></div>

<div class="result-area" id="resultArea">
  <h3 id="resultTitle">結果</h3>
  <div class="celebrate" id="celebrate"></div>
  <div class="score-num" id="scoreNum">0 / 5</div>
  <p id="resultMsg"></p>
  <button class="btn-retry" onclick="retryQuiz()">もう一度挑戦する</button>
</div>

<div class="nav">
  <a class="back" href="drill.html">← 演習へ戻る</a>
  <a href="../gamba_kounin.html">単元一覧へ →</a>
</div>

</section>

<div class="confetti" id="confetti"></div>

<script>
const questions = [
  {
    type:'基本①',
    warn:false,
    q:'次の不等式を解きなさい。<br>$3x + 4 \\leqq 13$',
    choices:['$x \\leqq 3$','$x \\geqq 3$','$x \\leqq 9$','$x \\geqq 9$'],
    correct:0,
    expl:'$3x \\leqq 9$ → $x \\leqq 3$（正の数で割るので向き変わらず）'
  },
  {
    type:'基本②',
    warn:false,
    q:'次の不等式を解きなさい。<br>$4x - 5 > 7$',
    choices:['$x > 3$','$x < 3$','$x > 12$','$x < 12$'],
    correct:0,
    expl:'$4x > 12$ → $x > 3$'
  },
  {
    type:'負の係数',
    warn:true,
    q:'次の不等式を解きなさい。<br>$-2x \\geqq 10$',
    choices:['$x \\geqq -5$','$x \\leqq -5$','$x \\geqq 5$','$x \\leqq 5$'],
    correct:1,
    expl:'両辺を $-2$ で割る → 反転して $x \\leqq -5$'
  },
  {
    type:'移項＋負の係数',
    warn:true,
    q:'次の不等式を解きなさい。<br>$-3x + 7 \\leqq 1$',
    choices:['$x \\geqq 2$','$x \\leqq 2$','$x \\geqq -2$','$x \\leqq -2$'],
    correct:0,
    expl:'$-3x \\leqq -6$ → 両辺を $-3$ で割って反転 → $x \\geqq 2$'
  },
  {
    type:'移項＋負の係数',
    warn:true,
    q:'次の不等式を解きなさい。<br>$-5x - 3 > 12$',
    choices:['$x < -3$','$x > -3$','$x < 3$','$x > 3$'],
    correct:0,
    expl:'$-5x > 15$ → 両辺を $-5$ で割って反転 → $x < -3$'
  }
];

let answered = [];

function renderQuiz(){
  const area = document.getElementById('quizArea');
  area.innerHTML = '';
  answered = new Array(questions.length).fill(null);
  questions.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'qcard';
    let warnTag = p.warn ? '<span class="warn-tag">⚠ 反転注意</span>' : '';
    card.innerHTML = `
      <div class="qheader">
        <span class="qnum">問${i+1}</span>
        <span class="qtype">${p.type}</span>
        ${warnTag}
      </div>
      <div class="qbody">${p.q}</div>
      <div class="choices" id="ch${i}">
        ${p.choices.map((c,j) => `<button class="choice-btn" onclick="selectAns(${i},${j})">${'①②③④'[j]} ${c}</button>`).join('')}
      </div>
      <div class="feedback" id="fb${i}"></div>
    `;
    area.appendChild(card);
  });
  document.getElementById('resultArea').classList.remove('show');
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(area, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
}

function selectAns(qIdx, cIdx){
  if(answered[qIdx] !== null) return;
  answered[qIdx] = cIdx;
  const correct = questions[qIdx].correct;
  const buttons = document.querySelectorAll(`#ch${qIdx} .choice-btn`);
  buttons.forEach((btn, j) => {
    btn.disabled = true;
    if(j === correct) btn.classList.add('correct');
    else if(j === cIdx) btn.classList.add('wrong');
  });
  const fb = document.getElementById(`fb${qIdx}`);
  if(cIdx === correct){
    fb.className = 'feedback show ok';
    fb.innerHTML = `⭕ 正解！<br>${questions[qIdx].expl}`;
  }else{
    fb.className = 'feedback show ng';
    fb.innerHTML = `❌ 不正解。正解は ${'①②③④'[correct]}<br>${questions[qIdx].expl}`;
  }
  if(typeof renderMathInElement === 'function'){
    renderMathInElement(fb, {
      delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],
      throwOnError:false
    });
  }
  if(answered.every(a => a !== null)){
    showResult();
  }
}

function showResult(){
  const score = answered.filter((a,i) => a === questions[i].correct).length;
  document.getElementById('scoreNum').textContent = `${score} / ${questions.length}`;
  const resultArea = document.getElementById('resultArea');
  const celebrate = document.getElementById('celebrate');
  const title = document.getElementById('resultTitle');
  const msg = document.getElementById('resultMsg');
  if(score === questions.length){
    title.textContent = '🎉 全問正解！';
    celebrate.textContent = '🎊✨🎉';
    msg.textContent = 'お見事！基本パターンはマスターしました。次の単元（IN03）に進みましょう。';
    showConfetti();
    if(typeof markPassed === 'function'){
      markPassed('IN02');
    }
  }else if(score >= 3){
    title.textContent = 'もう少し！';
    celebrate.textContent = '👍';
    msg.textContent = '間違えた問題を確認して、もう一度挑戦してみましょう。';
  }else{
    title.textContent = '復習が必要です';
    celebrate.textContent = '💪';
    msg.textContent = '例題に戻って解き方を確認してから、もう一度挑戦しましょう。';
  }
  resultArea.classList.add('show');
  resultArea.scrollIntoView({behavior:'smooth'});
}

function retryQuiz(){
  renderQuiz();
  window.scrollTo({top:0, behavior:'smooth'});
}

function showConfetti(){
  const confetti = document.getElementById('confetti');
  confetti.innerHTML = '';
  const colors = ['#1d4ed8','#3b82f6','#facc15','#e8372d','#16a34a','#9333ea'];
  for(let i = 0; i < 60; i++){
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
    confetti.appendChild(piece);
  }
  confetti.classList.add('show');
  setTimeout(() => {
    confetti.classList.remove('show');
  }, 5000);
}

window.addEventListener('load', () => {
  if(window._katexReady){
    renderQuiz();
  }else{
    window._onKatexReady = renderQuiz;
  }
});
</script>

</body>
</html>
