<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QU09 2次不等式 ② 例題</title>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'BIZ UDPGothic',sans-serif;background:#fafaf9;color:#1c1917;font-size:16px;line-height:1.7;}
.header{background:#d97706;color:white;padding:14px 20px;}
.header h1{font-size:1.1rem;font-weight:700;}
.header p{font-size:0.85rem;opacity:0.9;margin-top:2px;}
.container{max-width:680px;margin:0 auto;padding:20px 16px 60px;}
.card{background:white;border-radius:12px;padding:20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.card h2{font-size:1rem;font-weight:700;color:#d97706;margin-bottom:12px;padding-bottom:8px;border-bottom:2px solid #fde68a;}
.step-nav{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.step-btn{flex:1;min-width:80px;padding:8px 4px;border:none;border-radius:8px;font-family:inherit;font-size:0.78rem;cursor:pointer;font-weight:700;}
.step-btn.active{background:#d97706;color:white;}
.step-btn.done{background:#d1fae5;color:#065f46;}
.step-btn.inactive{background:#f5f5f4;color:#a8a29e;}
.problem-box{background:#fffbeb;border:2px solid #d97706;border-radius:10px;padding:14px;margin-bottom:10px;font-size:0.95rem;}
canvas{display:block;margin:8px auto;}
.toggle-btn{background:#f5f5f4;border:1px solid #d6d3d1;border-radius:8px;padding:8px 16px;font-family:inherit;font-size:0.88rem;cursor:pointer;margin-top:10px;}
.hidden{display:none;}
.sol-step{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start;}
.sol-num{background:#d97706;color:white;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:0.85rem;flex-shrink:0;margin-top:2px;}
.sol-text{font-size:0.92rem;line-height:1.7;}
.answer-box{background:#fef3c7;border-radius:8px;padding:12px 14px;margin-top:10px;font-weight:700;color:#92400e;font-size:0.93rem;}
.nav-btn{display:block;width:100%;padding:14px;background:#d97706;color:white;border:none;border-radius:10px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer;text-align:center;margin-top:8px;}
.nav-btn:hover{background:#b45309;}
.back-link{display:block;text-align:center;color:#a8a29e;font-size:0.85rem;margin-top:14px;text-decoration:none;}
.back-link:hover{color:#d97706;}
</style>
</head>
<body>
<div class="header">
  <h1>QU09 ② 例題 ― 2次不等式</h1>
  <p>第4章 二次関数 ／ 難易度 ★★★</p>
</div>
<div class="container">
  <div class="step-nav">
    <button class="step-btn done" onclick="location.href='intro.html'">①導入</button>
    <button class="step-btn active">②例題</button>
    <button class="step-btn inactive" onclick="location.href='drill.html'">③練習</button>
    <button class="step-btn inactive" onclick="location.href='check.html'">④確認</button>
  </div>

  <!-- 例題1: > 0（外側） -->
  <div class="card">
    <h2>【例題1】> 0（外側）先生テキスト例題2(1)</h2>
    <div class="problem-box"><p id="p1"></p></div>
    <canvas id="cv1" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s1',this)">解答・解説を見る</button>
    <div id="s1" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><strong>因数分解して交点を求める</strong><br><span id="s1a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>&gt; 0 → 外側（x軸より上）</strong><br><span id="s1b"></span></div></div>
      <div class="answer-box" id="a1"></div>
    </div>
  </div>

  <!-- 例題2: < 0（内側） -->
  <div class="card">
    <h2>【例題2】&lt; 0（内側）先生テキスト例題2(2)</h2>
    <div class="problem-box"><p id="p2"></p></div>
    <canvas id="cv2" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s2',this)">解答・解説を見る</button>
    <div id="s2" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><span id="s2a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>&lt; 0 → 内側</strong><br><span id="s2b"></span></div></div>
      <div class="answer-box" id="a2"></div>
    </div>
  </div>

  <!-- 例題3: ≦ 0（等号あり）-->
  <div class="card">
    <h2>【例題3】≦ 0（等号あり）過去問類似</h2>
    <div class="problem-box"><p id="p3"></p></div>
    <canvas id="cv3" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s3',this)">解答・解説を見る</button>
    <div id="s3" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><span id="s3a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>≦ 0 → 内側＋等号含む</strong><br><span id="s3b"></span></div></div>
      <div class="answer-box" id="a3"></div>
    </div>
  </div>

  <!-- 例題4: a<0 (係数が負) -->
  <div class="card">
    <h2>【例題4】係数が負（a &lt; 0）の場合 ― R7-1 類似</h2>
    <div class="problem-box"><p id="p4"></p></div>
    <canvas id="cv4" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s4',this)">解答・解説を見る</button>
    <div id="s4" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><strong>両辺を −1 倍して a &gt; 0 にする（不等号の向きが逆！）</strong><br><span id="s4a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><strong>因数分解</strong><br><span id="s4b"></span></div></div>
      <div class="sol-step"><div class="sol-num">3</div>
        <div class="sol-text"><strong>&lt; 0 → 内側</strong><br><span id="s4c"></span></div></div>
      <div class="answer-box" id="a4"></div>
    </div>
  </div>

  <!-- 例題5: 係数あり（たすき掛け後）-->
  <div class="card">
    <h2>【例題5】係数あり（R4-1 類似）</h2>
    <div class="problem-box"><p id="p5"></p></div>
    <canvas id="cv5" width="300" height="160"></canvas>
    <button class="toggle-btn" onclick="tog('s5',this)">解答・解説を見る</button>
    <div id="s5" class="hidden">
      <div class="sol-step"><div class="sol-num">1</div>
        <div class="sol-text"><span id="s5a"></span></div></div>
      <div class="sol-step"><div class="sol-num">2</div>
        <div class="sol-text"><span id="s5b"></span></div></div>
      <div class="answer-box" id="a5"></div>
    </div>
  </div>

  <button class="nav-btn" onclick="location.href='drill.html'">③ 練習へ進む →</button>
  <a href="https://realizefield.github.io/gamba-kounin-seito/gamba-kounin-seito.html" class="back-link">← メニューに戻る</a>
</div>

<script>
function k(e){return katex.renderToString(e,{throwOnError:false});}
function tog(id,btn){const el=document.getElementById(id);el.classList.toggle('hidden');btn.textContent=el.classList.contains('hidden')?'解答・解説を見る':'解答・解説を隠す';}

document.getElementById('p1').innerHTML='次の2次不等式を解け：'+k('x^2-5x+4>0');
document.getElementById('s1a').innerHTML=k('x^2-5x+4=(x-1)(x-4)=0')+'　→ '+k('x=1,\\;4');
document.getElementById('s1b').innerHTML='x軸より上の部分 → 外側 → '+k('x<1')+' または '+k('x>4');
document.getElementById('a1').innerHTML='答）'+k('x<1')+' または '+k('x>4');

document.getElementById('p2').innerHTML='次の2次不等式を解け：'+k('x^2-5x+4<0');
document.getElementById('s2a').innerHTML='交点は同じ：'+k('x=1,\\;4');
document.getElementById('s2b').innerHTML='x軸より下の部分 → 内側';
document.getElementById('a2').innerHTML='答）'+k('1<x<4');

document.getElementById('p3').innerHTML='次の2次不等式を解け：'+k('(x+1)(x-3) \\leqq 0');
document.getElementById('s3a').innerHTML=k('(x+1)(x-3)=0')+'　→ '+k('x=-1,\\;3');
document.getElementById('s3b').innerHTML='内側、かつ端点を含む';
document.getElementById('a3').innerHTML='答）'+k('-1 \\leqq x \\leqq 3');

document.getElementById('p4').innerHTML='次の2次不等式を解け：'+k('-x^2-3x+10>0')+'　（右の図はy='+k('-x^2-3x+10')+'のグラフ）';
document.getElementById('s4a').innerHTML='両辺を−1倍（不等号逆に！）：'+k('x^2+3x-10<0');
document.getElementById('s4b').innerHTML=k('(x+5)(x-2)=0')+'　→ '+k('x=-5,\\;2');
document.getElementById('s4c').innerHTML='&lt;0 → 内側';
document.getElementById('a4').innerHTML='答）'+k('-5<x<2');

document.getElementById('p5').innerHTML='次の2次不等式を解け：'+k('(2x+1)(x-3)>0');
document.getElementById('s5a').innerHTML=k('(2x+1)(x-3)=0')+'　→ '+k('x=-\\dfrac{1}{2},\\;3');
document.getElementById('s5b').innerHTML='&gt;0 → 外側';
document.getElementById('a5').innerHTML='答）'+k('x<-\\dfrac{1}{2}')+' または '+k('x>3');

// グラフ描画
function drawIneq(id, f, r1, r2, shade){
  const cv=document.getElementById(id);
  const ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height;
  const mid=(r1+r2)/2;
  const sc=Math.min(44,(W-40)/(Math.abs(r2-r1)+2));
  const ox=W/2-mid*sc;
  const allY=[];for(let x=r1-0.5;x<=r2+0.5;x+=0.1)allY.push(f(x));
  const ymin=Math.min(...allY),ymax=Math.max(...allY);
  const oy=H*0.5+(ymax+ymin)/2*sc*0.25;
  function px(x){return ox+x*sc;}function py(y){return oy-y*sc;}
  ctx.clearRect(0,0,W,H);
  ctx.strokeStyle='#d6d3d1';ctx.lineWidth=1;
  if(oy>4&&oy<H-4){ctx.beginPath();ctx.moveTo(6,oy);ctx.lineTo(W-6,oy);ctx.stroke();}

  // 塗りつぶし
  if(shade==='inner'){
    ctx.save();ctx.beginPath();ctx.moveTo(px(r1),oy);
    for(let x=r1;x<=r2;x+=0.05)ctx.lineTo(px(x),py(f(x)));
    ctx.lineTo(px(r2),oy);ctx.closePath();
    ctx.fillStyle='rgba(59,130,246,0.2)';ctx.fill();ctx.restore();
  } else {
    [[r1-1.5,r1],[r2,r2+1.5]].forEach(([xa,xb])=>{
      ctx.save();ctx.beginPath();ctx.moveTo(px(xa),oy);
      for(let x=xa;x<=xb;x+=0.05){const y=f(x);if(py(y)>4&&py(y)<H-4)ctx.lineTo(px(x),py(y));}
      ctx.lineTo(px(xb),oy);ctx.closePath();ctx.fillStyle='rgba(16,185,129,0.18)';ctx.fill();ctx.restore();
    });
  }
  ctx.strokeStyle='#d97706';ctx.lineWidth=2.5;ctx.beginPath();
  for(let x=r1-1.8;x<=r2+1.8;x+=0.05){
    const y=f(x);if(py(y)<-10||py(y)>H+10)continue;
    x===r1-1.8?ctx.moveTo(px(x),py(y)):ctx.lineTo(px(x),py(y));
  }
  ctx.stroke();
  [r1,r2].forEach(r=>{
    ctx.fillStyle='#b45309';ctx.beginPath();ctx.arc(px(r),py(0),4,0,Math.PI*2);ctx.fill();
  });
  ctx.fillStyle='#57534e';ctx.font='11px BIZ UDPGothic';
  [r1,r2].forEach(r=>ctx.fillText(Number.isInteger(r*2)?(r===Math.floor(r)?r:r.toFixed(1)):r.toFixed(2),px(r)-6,oy+13));
}

drawIneq('cv1',x=>x*x-5*x+4,1,4,'outer');
drawIneq('cv2',x=>x*x-5*x+4,1,4,'inner');
drawIneq('cv3',x=>(x+1)*(x-3),-1,3,'inner');
drawIneq('cv4',x=>-(x*x)-3*x+10,-5,2,'inner');
drawIneq('cv5',x=>(2*x+1)*(x-3),-0.5,3,'outer');
</script>
<script src="https://realizefield.github.io/gamba-kounin-seito/gamba-ai.js" defer></script>
</body>
</html>
